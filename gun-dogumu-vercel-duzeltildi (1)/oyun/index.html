<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Son Ateş</title>
<style>
:root{--ink:#f1e6cf;--muted:#a89a80;--panel:rgba(14,12,10,.78);--line:rgba(241,230,207,.14);--fire:#ff8a2a;--blood:#c3271b;--bg:#050505}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
.bar{position:relative;height:7px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;flex:1;min-width:60px}
.bar i{position:absolute;inset:0;width:50%;background:#7c6;border-radius:4px;transition:width .15s}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#top{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:210px;font-size:13px}
#top .row{display:flex;align-items:center;gap:8px}
#res{display:flex;gap:10px;font-size:13px}
#fireBar{background:linear-gradient(90deg,#c33,#f80,#fd4)}
#todBar{background:linear-gradient(90deg,#fd6,#88a)}
#msgs{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(92vw,560px)}
#msgs div{background:rgba(0,0,0,.6);padding:5px 12px;border-radius:6px;font-size:14px;text-align:center;transition:opacity .5s}
#side{position:absolute;right:10px;top:10px;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;pointer-events:auto;font-size:12px;max-height:60vh;overflow:auto}
#sideHead{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;letter-spacing:.08em}
#side.closed #plist{display:none}
.pr{display:grid;grid-template-columns:1fr auto;gap:2px 6px;padding:5px 10px;border-bottom:1px solid rgba(255,255,255,.05)}
.pr .nm{font-weight:bold}
.pr .bars{grid-column:1/3;display:flex;gap:4px}
.pr .bars .bar{height:4px}
.pr .fear i{background:linear-gradient(90deg,#6a6,#d33)}
.job{pointer-events:auto;background:#2b2419;color:var(--ink);border:1px solid #5a4a30;border-radius:5px;font:11px Georgia,serif;padding:2px 6px;cursor:pointer}
.job:active{background:#4a3a20}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px 8px}
#prompt{font-size:14px;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:6px;min-height:0}
#prompt:empty{display:none}
#bars{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;width:min(420px,94vw)}
#hpBar{background:linear-gradient(90deg,#922,#e44)}
#stBar{background:linear-gradient(90deg,#aa7,#ee9)}
#tools{display:flex;gap:5px;pointer-events:auto;overflow-x:auto;max-width:100%;padding-bottom:2px}
#tools button{background:var(--panel);color:var(--ink);border:1px solid #5a4a30;border-radius:8px;font:12px Georgia,serif;padding:5px 8px;cursor:pointer;white-space:nowrap;line-height:1.25}
#tools button small{color:var(--muted)}
#tools button.on{border-color:var(--fire);box-shadow:0 0 8px rgba(255,138,42,.5)}
#tools button.no{opacity:.45}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:0;bottom:0;width:50%;height:62%;pointer-events:auto}
#knobBase{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:none}
#knob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);left:31px;top:31px}
#tbtns{position:absolute;right:12px;bottom:118px;display:grid;grid-template-columns:repeat(2,64px);gap:10px;pointer-events:auto}
#tbtns div{width:64px;height:64px;border-radius:50%;background:rgba(20,16,12,.7);border:2px solid rgba(255,200,140,.35);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center}
#tbtns div.act{background:rgba(120,60,20,.8)}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 70%,#2a1408 0%,#050403 70%);z-index:5;padding:20px;overflow:auto}
#screen .box{max-width:560px;text-align:center}
#screen h1{font-size:clamp(44px,11vw,84px);margin:0;letter-spacing:.12em;color:#ffb067;text-shadow:0 0 30px rgba(255,100,20,.6),0 0 4px #000}
#screen p{color:#d8c8a8;line-height:1.6;font-size:15px}
#screen .story{font-style:italic;color:#bba98a}
#screen button{margin-top:14px;background:#3a1d0b;color:#ffd2a0;border:1px solid #c66a25;padding:12px 34px;font:20px Georgia,serif;border-radius:8px;cursor:pointer;letter-spacing:.1em}
#screen button:hover{background:#5a2a0e}
#screen .keys{font-size:13px;color:#a89a80;text-align:left;display:inline-block;margin-top:6px;line-height:1.7}
#screen .keys b{color:#e8d4b0}
#pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);font-size:32px;z-index:4;letter-spacing:.2em}
@media (max-width:700px){#side{width:190px;font-size:11px;max-height:45vh}#top{min-width:0;font-size:12px}#res{gap:7px;font-size:12px}#msgs{top:96px}#msgs div{font-size:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="top">
    <div class="row"><b id="dayTxt">1. Gün</b><span id="todTxt">☀️</span><div class="bar"><i id="todBar"></i></div></div>
    <div id="res"><span>🪵 <b id="rWood">0</b></span><span>🪨 <b id="rStone">0</b></span><span>🍖 <b id="rFood">0</b></span><span>👥 <b id="rPop">0</b></span></div>
    <div class="row">🔥<div class="bar"><i id="fireBar"></i></div></div>
  </div>
  <div id="msgs"></div>
  <div id="side"><div id="sideHead"><span>HALKIN</span><span id="sideTog">▾</span></div><div id="plist"></div></div>
  <div id="bottom">
    <div id="prompt"></div>
    <div id="bars">❤<div class="bar"><i id="hpBar"></i></div>⚡<div class="bar"><i id="stBar"></i></div></div>
    <div id="tools">
      <button data-b="kulube">🛖 Kulübe<br><small>15🪵 4🪨</small></button>
      <button data-b="cit">🪵 Kazık Çit<br><small>4🪵</small></button>
      <button data-b="mesale">🔦 Meşale Direği<br><small>4🪵 2🪨</small></button>
      <button data-b="tuzak">⚠️ Kazık Tuzağı<br><small>4🪵 3🪨</small></button>
      <button data-c="mizrak" id="cMizrak">🗡️ Taş Mızrak<br><small>5🪵 10🪨</small></button>
      <button data-c="mesale" id="cTorch">🔥 El Meşalesi<br><small>6🪵 · [T]</small></button>
    </div>
  </div>
</div>

<div id="touch">
  <div id="joy"><div id="knobBase"><div id="knob"></div></div></div>
  <div id="tbtns">
    <div id="tTorch">Meşale</div><div id="tRun">Koş</div>
    <div id="tAct">Topla<br>/Kullan</div><div id="tAtk" class="act">Saldır</div>
  </div>
</div>

<div id="pause">DURAKLATILDI</div>

<div id="screen"><div class="box" id="screenBox"></div></div>

<script>
'use strict';
// =============================================================
//  SON ATEŞ — dinozorlar çağında hayatta kalma / korku / halk yönetimi
// =============================================================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
function angLerp(a, b, t) { let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
const $ = id => document.getElementById(id);
// Türkçe ek uyumu: gen = 'ın, acc = 'ı, cop = 'sın
function harm(w) { const m = w.toLocaleLowerCase('tr').match(/[aeıioöuü](?=[^aeıioöuü]*$)/); const v = m ? m[0] : 'e'; return 'aı'.includes(v) ? 'ı' : 'ei'.includes(v) ? 'i' : 'ou'.includes(v) ? 'u' : 'ü'; }
const endsV = w => /[aeıioöuü]$/i.test(w);
const gen = w => w + "'" + (endsV(w) ? 'n' : '') + harm(w) + 'n';
const acc = w => w + "'" + (endsV(w) ? 'y' : '') + harm(w);
const cop = w => w + "'s" + harm(w) + 'n';

const cv = $('c'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
let VW, VH, DPR;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  VW = innerWidth; VH = innerHeight;
  cv.width = dark.width = Math.round(VW * DPR);
  cv.height = dark.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------- sabitler
const WORLD = 4400, CAMP = { x: 2200, y: 2200 };
const CYCLE = 280; // bir gün+gece süresi (sn)
const NAMES = ['Arda','Ece','Toprak','Deniz','Kaya','Ilgın','Bora','Su','Tan','Yağmur','Doruk','Nehir','Çınar','Defne','Alp','Elif','Umut','Ay','Bulut','Duru','Ege','Lale','Oğuz','Selin','Yiğit','Mert','Zeynep','Kuzey','Asya','Poyraz','Rüzgar','Sema','Ozan','Ada','Kartal','Pınar'];
const JOBS = ['odun', 'tas', 'yiyecek', 'muhafiz', 'takip'];
const JOBL = { odun: '🪵 Odun', tas: '🪨 Taş', yiyecek: '🫐 Yiyecek', muhafiz: '🛡️ Muhafız', takip: '👣 Takip' };
const JOBC = { odun: '#8a5a32', tas: '#7c7c7c', yiyecek: '#7a3a6a', muhafiz: '#2c4f7a', takip: '#5c6b2a' };
const DINO = {
  kucuk:    { ad: 'Sürüngeç', r: 10, hp: 18,  spd: 175, dmg: 4,  cd: 0.7, col: '#6b7d3a', eye: '#b6ff5a', meat: 2,  sense: 380, nsense: 560 },
  yirtici:  { ad: 'Yırtıcı',  r: 18, hp: 60,  spd: 215, dmg: 12, cd: 0.9, col: '#8a4b2a', eye: '#ffd23a', meat: 8,  sense: 480, nsense: 850 },
  dev:      { ad: 'Dev Kafa', r: 44, hp: 520, spd: 118, dmg: 40, cd: 1.6, col: '#3e3b35', eye: '#ff3a1a', meat: 60, sense: 700, nsense: 1100 },
  boynuzlu: { ad: 'Boynuzlu', r: 34, hp: 160, spd: 80,  dmg: 22, cd: 1.3, col: '#a08860', eye: '#ddd',    meat: 25, sense: 260, nsense: 260 }
};
const BUILD = {
  kulube: { ad: 'Kulübe',        cost: { wood: 15, stone: 4 }, r: 30, hp: 240 },
  cit:    { ad: 'Kazık Çit',     cost: { wood: 4 },            r: 20, hp: 140 },
  mesale: { ad: 'Meşale Direği', cost: { wood: 4, stone: 2 },  r: 8,  hp: 70, light: 150 },
  tuzak:  { ad: 'Kazık Tuzağı',  cost: { wood: 4, stone: 3 },  r: 16, hp: 999 }
};

// ------------------------------------------------------------- ses (WebAudio, tamamen sentez)
const A = { ctx: null };
function audioInit() {
  if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    A.ctx = ac;
    A.master = ac.createGain(); A.master.gain.value = 0.7; A.master.connect(ac.destination);
    const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.noise = buf;
    // brown noise rüzgar
    const bb = ac.createBuffer(1, len, ac.sampleRate), bd = bb.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
    const w = ac.createBufferSource(); w.buffer = bb; w.loop = true;
    const wf = ac.createBiquadFilter(); wf.type = 'lowpass'; wf.frequency.value = 500;
    A.wind = ac.createGain(); A.wind.gain.value = 0.05;
    w.connect(wf); wf.connect(A.wind); A.wind.connect(A.master); w.start();
    // derin uğultu (gece gerilimi)
    const dr = ac.createOscillator(); dr.type = 'sine'; dr.frequency.value = 43;
    const dr2 = ac.createOscillator(); dr2.type = 'sine'; dr2.frequency.value = 44.3;
    A.drone = ac.createGain(); A.drone.gain.value = 0;
    dr.connect(A.drone); dr2.connect(A.drone); A.drone.connect(A.master); dr.start(); dr2.start();
    const dist = ac.createWaveShaper(); const c = new Float32Array(256);
    for (let i = 0; i < 256; i++) { const x = i / 128 - 1; c[i] = Math.tanh(x * 4); }
    dist.curve = c; A.dist = dist; dist.connect(A.master);
  } catch (e) { A.ctx = null; }
}
function out(pan) {
  if (pan !== undefined && A.ctx.createStereoPanner) { const p = A.ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); p.connect(A.master); return p; }
  return A.master;
}
function tone(type, f0, f1, dur, vol, opt = {}) {
  if (!A.ctx || vol < 0.003) return;
  const ac = A.ctx, t = ac.currentTime + (opt.delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (opt.att || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  if (opt.vib) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = opt.vib; lg.gain.value = f0 * 0.06; l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur); }
  o.connect(g); g.connect(opt.dist ? A.dist : out(opt.pan)); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, f0, f1, opt = {}) {
  if (!A.ctx || vol < 0.003) return;
  const ac = A.ctx, t = ac.currentTime + (opt.delay || 0);
  const s = ac.createBufferSource(); s.buffer = A.noise; s.playbackRate.value = opt.rate || 1;
  const f = ac.createBiquadFilter(); f.type = ftype; f.Q.value = opt.q || 1;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (opt.att || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(opt.dist ? A.dist : out(opt.pan)); s.start(t, Math.random()); s.stop(t + dur + 0.05);
}
const SFX = {
  roar(v, pan) { noise(2.4, v * 0.9, 'lowpass', 900, 90, { att: 0.25, q: 4, pan }); tone('sawtooth', 95, 38, 2.3, v * 0.45, { att: 0.3, dist: true, vib: 7 }); tone('square', 190, 70, 1.8, v * 0.12, { att: 0.2, vib: 11, pan }); },
  screech(v, pan) { tone('sawtooth', 1100, 1700, 0.18, v * 0.25, { pan }); tone('sawtooth', 1600, 600, 0.45, v * 0.25, { delay: 0.16, vib: 30, pan }); noise(0.5, v * 0.25, 'bandpass', 3000, 1500, { q: 3, pan }); },
  chirp(v, pan) { tone('square', 1800, 2600, 0.08, v * 0.12, { pan }); tone('square', 2200, 1500, 0.1, v * 0.12, { delay: 0.1, pan }); },
  thump(v) { tone('sine', 70, 28, 0.45, v, { att: 0.005 }); noise(0.25, v * 0.5, 'lowpass', 200, 40); },
  hit(v) { noise(0.12, v * 0.6, 'highpass', 1200, 600); tone('triangle', 220, 90, 0.1, v * 0.4); },
  swing() { noise(0.16, 0.12, 'bandpass', 600, 2400, { q: 2 }); },
  chop() { noise(0.07, 0.25, 'bandpass', 900, 500, { q: 4 }); tone('triangle', 300, 150, 0.06, 0.12); },
  rock() { noise(0.06, 0.25, 'highpass', 3000, 2000); tone('square', 900, 700, 0.04, 0.05); },
  pickup() { tone('sine', 600, 900, 0.08, 0.08); },
  scream(v, pan) { tone('sawtooth', 820, 300, 1.4, v * 0.3, { vib: 9, att: 0.05, pan }); tone('triangle', 1240, 450, 1.3, v * 0.15, { vib: 13, pan }); },
  heart(v) { tone('sine', 62, 38, 0.18, v); tone('sine', 58, 34, 0.18, v * 0.8, { delay: 0.22 }); },
  rustle(v, pan) { for (let i = 0; i < 5; i++) noise(0.09, v * rand(0.3, 1), 'bandpass', rand(1500, 4000), 1200, { delay: i * rand(0.06, 0.14), q: 1.5, pan }); },
  crackle(v) { noise(0.03, v, 'highpass', 2500, 2000); },
  bird() { const f = rand(2000, 3200); tone('sine', f, f * 1.3, 0.09, 0.025); tone('sine', f * 1.2, f * 0.9, 0.12, 0.025, { delay: 0.12 }); },
  build() { noise(0.1, 0.25, 'lowpass', 600, 200); tone('triangle', 200, 120, 0.15, 0.15, { delay: 0.12 }); },
  bell() { tone('sine', 520, 520, 1.2, 0.08); tone('sine', 780, 780, 1.0, 0.05); },
  sting() { tone('sawtooth', 110, 104, 2.5, 0.12, { att: 0.02, dist: true }); tone('sine', 1300, 1250, 2.0, 0.04, { vib: 6 }); }
};

// ------------------------------------------------------------- uzaysal ızgara (engeller)
const CELL = 200; let grid = new Map();
function cellsOf(o, fn) {
  const x0 = Math.floor((o.x - o.r) / CELL), x1 = Math.floor((o.x + o.r) / CELL);
  const y0 = Math.floor((o.y - o.r) / CELL), y1 = Math.floor((o.y + o.r) / CELL);
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) fn(x * 10007 + y);
}
function gAdd(o) { cellsOf(o, k => { let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(o); }); }
function gDel(o) { cellsOf(o, k => { const a = grid.get(k); if (a) { const i = a.indexOf(o); if (i >= 0) a.splice(i, 1); } }); }
function gQuery(x, y, r) {
  const res = [];
  const x0 = Math.floor((x - r) / CELL), x1 = Math.floor((x + r) / CELL), y0 = Math.floor((y - r) / CELL), y1 = Math.floor((y + r) / CELL);
  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) { const a = grid.get(cx * 10007 + cy); if (a) for (const o of a) if (!res.includes(o)) res.push(o); }
  return res;
}

// ------------------------------------------------------------- oyun durumu
const G = {}; let L = null; // L = lider
let groundPat = null;
function makeGround() {
  const c = document.createElement('canvas'); c.width = c.height = 384; const g = c.getContext('2d');
  g.fillStyle = '#2c3f22'; g.fillRect(0, 0, 384, 384);
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * 384, y = Math.random() * 384;
    g.fillStyle = pick(['#34492a', '#273a1f', '#3a5030', '#2f4425', '#3d4a28', '#24331b']);
    g.fillRect(x, y, rand(1, 3), rand(2, 6));
  }
  for (let i = 0; i < 14; i++) { g.fillStyle = 'rgba(70,55,30,.18)'; g.beginPath(); g.ellipse(Math.random() * 384, Math.random() * 384, rand(10, 40), rand(6, 22), rand(0, 3), 0, TAU); g.fill(); }
  groundPat = ctx.createPattern(c, 'repeat');
}

function mkPerson(x, y, name, leader) {
  return { id: ++G.idc, name, x, y, r: 11, hp: leader ? 100 : 60, maxhp: leader ? 100 : 60, fear: 0, job: leader ? null : pick(['odun', 'yiyecek', 'odun', 'tas']),
    st: 'idle', tgt: null, carry: 0, work: 0, ang: rand(0, TAU), anim: 0, leader: !!leader, atkCd: 0, hurtT: 0, lastHurt: 99, inHut: null,
    skin: pick(['#e0b48a', '#c99068', '#a8754f', '#f0c8a0', '#8a5a3a']), hair: pick(['#2a1a10', '#4a2e18', '#111', '#6a4020', '#8a6a3a']),
    stam: 100, stuck: 0, detour: 0, seat: rand(0, TAU), grabbed: false, desert: 0, moving: false, lx: x, ly: y };
}
function mkDino(type, x, y) {
  const d = DINO[type];
  return { type, x, y, r: d.r, hp: d.hp, maxhp: d.hp, ang: rand(0, TAU), anim: rand(0, 9), atkCd: 0, think: 0, tgt: null, wx: x, wy: y, wt: 0,
    hurt: 0, leave: false, tamed: false, angry: 0, ko: 0, koDone: false, carry: null, carryDmg: 0, orbit: Math.random() < 0.5 ? 1 : -1,
    engaged: false, stepT: 0, rush: 0, roarT: rand(4, 10), blink: rand(1, 5), moving: false, bash: null, trapCd: 0, id: ++G.idc };
}

function newGame() {
  grid = new Map();

function freshName() {
  const free = NAMES.filter(n => !G.usedNames.has(n));
  const n = free.length ? pick(free) : pick(NAMES) + ' ' + ri(2, 9);
  G.usedNames.add(n); return n;
}

function genWorld() {
  const nearCamp = (x, y, m) => Math.hypot(x - CAMP.x, y - CAMP.y) < m;
  for (let i = 0; i < 8; i++) {
    let x, y, r, k = 0;
    do { x = rand(300, WORLD - 300); y = rand(300, WORLD - 300); r = rand(110, 240); } while (nearCamp(x, y, r + 520) && k++ < 60);
    const o = { x, y, r, kind: 'lake', seed: Math.random() }; G.lakes.push(o); gAdd(o);
  }
  const free = (x, y, m) => x > 60 && y > 60 && x < WORLD - 60 && y < WORLD - 60 && !G.lakes.some(l => Math.hypot(l.x - x, l.y - y) < l.r + m);
  function addTree(x, y) {
    if (!free(x, y, 30) || nearCamp(x, y, 250)) return;
    if (gQuery(x, y, 40).some(o => (o.kind === 'tree' || o.kind === 'rock') && Math.hypot(o.x - x, o.y - y) < 40)) return;
    const t = { x, y, r: 13, kind: 'tree', wood: 18, cr: rand(36, 62), tone: Math.random(), sw: rand(0, TAU) };
    G.trees.push(t); gAdd(t);
  }
  for (let c = 0; c < 55; c++) { const cx = rand(0, WORLD), cy = rand(0, WORLD), n = ri(12, 30); for (let i = 0; i < n; i++) { const a = rand(0, TAU), rr = Math.abs(gauss()) * 280; addTree(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } }
  for (let i = 0; i < 300; i++) addTree(rand(0, WORLD), rand(0, WORLD));
  for (let i = 0; i < 18; i++) { const a = rand(0, TAU), r = rand(270, 560); addTree(CAMP.x + Math.cos(a) * r, CAMP.y + Math.sin(a) * r); }
  function addRock(x, y) {
    if (!free(x, y, 30) || nearCamp(x, y, 220)) return;
    if (gQuery(x, y, 50).some(o => (o.kind === 'tree' || o.kind === 'rock') && Math.hypot(o.x - x, o.y - y) < 46)) return;
    const r = rand(16, 28), v = []; const n = ri(6, 9);
    for (let i = 0; i < n; i++) { const a = i / n * TAU; v.push([Math.cos(a) * r * rand(0.75, 1.15), Math.sin(a) * r * rand(0.75, 1.15)]); }
    const o = { x, y, r, kind: 'rock', stone: 14, v, shade: rand(0.85, 1.15) }; G.rocks.push(o); gAdd(o);
  }
  for (let c = 0; c < 70; c++) { const cx = rand(0, WORLD), cy = rand(0, WORLD), n = ri(1, 4); for (let i = 0; i < n; i++) addRock(cx + rand(-70, 70), cy + rand(-70, 70)); }
  for (let i = 0; i < 7; i++) { const a = rand(0, TAU), r = rand(300, 600); addRock(CAMP.x + Math.cos(a) * r, CAMP.y + Math.sin(a) * r); }
  function addBush(x, y) {
    if (!free(x, y, 20) || nearCamp(x, y, 160)) return;
    G.bushes.push({ x, y, r: 16, food: 5, max: 5, berries: Array.from({ length: 7 }, () => [rand(-11, 11), rand(-11, 11)]), col: pick(['#b3243a', '#6a2a8a', '#c4382a']) });
  }
  for (let i = 0; i < 260; i++) addBush(rand(0, WORLD), rand(0, WORLD));
  for (let i = 0; i < 12; i++) { const a = rand(0, TAU), r = rand(200, 480); addBush(CAMP.x + Math.cos(a) * r, CAMP.y + Math.sin(a) * r); }
}

// ------------------------------------------------------------- zaman / ışık
const phase = () => (G.t % CYCLE) / CYCLE;
function darkness() {
  const p = phase();
  if (p < 0.47) return 0;
  if (p < 0.6) { const k = (p - 0.47) / 0.13; return 0.95 * k * k * (3 - 2 * k); }
  if (p < 0.9) return 0.95;
  const k = (p - 0.9) / 0.1; return 0.95 * (1 - k * k * (3 - 2 * k));
}
const isNight = () => darkness() > 0.55;
const goHome = () => { const p = phase(); return p > 0.46 && p < 0.93; };
function fireR() { return G.fire.fuel <= 0 ? 0 : 90 + G.fire.fuel * 2.6; }
function lights() {
  const L2 = [];
  if (G.fire.fuel > 0) L2.push({ x: G.fire.x, y: G.fire.y, r: fireR() * (0.96 + Math.sin(G.now * 13) * 0.02 + Math.random() * 0.03), safe: true, warm: 1 });
  for (const b of G.builds) if (b.type === 'mesale') L2.push({ x: b.x, y: b.y - 20, r: 150 * (0.97 + Math.random() * 0.04), safe: true, warm: 0.6 });
  if (L && G.torchOn && L.hp > 0) L2.push({ x: L.x, y: L.y, r: 175 * (0.95 + Math.random() * 0.06), safe: true, warm: 0.7 });
  return L2;
}
// gece güvenli bölgeler (yırtıcılar giremez - cesur değillerse)
function safeZones() {
  const z = [], n = isNight();
  if (G.fire.fuel > 0) z.push({ x: G.fire.x, y: G.fire.y, r: n ? fireR() * 0.88 : Math.max(fireR(), 320) });
  if (n) {
    for (const b of G.builds) if (b.type === 'mesale') z.push({ x: b.x, y: b.y, r: 125 });
    if (G.torchOn && L) z.push({ x: L.x, y: L.y, r: 135 });
  }
  return z;
}
function inSafe(x, y, zones) { for (const s of zones) if ((x - s.x) ** 2 + (y - s.y) ** 2 < s.r * s.r) return s; return null; }
function lightLevel(x, y, LS) {
  if (darkness() < 0.45) return 1;
  let m = 0;
  for (const l of LS) { const d = Math.hypot(x - l.x, y - l.y); m = Math.max(m, clamp((l.r - d) / (l.r * 0.45), 0, 1)); }
  return m;
}

  joy.addEventListener('pointermove', e => { if (e.pointerId !== touch.id) return; let dx = e.clientX - touch.ox, dy = e.clientY - touch.oy; const m = Math.hypot(dx, dy); if (m > 45) { dx *= 45 / m; dy *= 45 / m; } touch.jx = dx / 45; touch.jy = dy / 45; knob.style.left = (31 + dx) + 'px'; knob.style.top = (31 + dy) + 'px'; });
  const end = e => { if (e.pointerId !== touch.id) return; touch.id = null; touch.jx = touch.jy = 0; base.style.display = 'none'; knob.style.left = knob.style.top = '31px'; };

function canAfford(c) { for (const k in c) if (G.stock[k] < c[k]) return false; return true; }
function pay(c) { for (const k in c) G.stock[k] -= c[k]; }
function costTxt(c) { return Object.entries(c).map(([k, v]) => v + (k === 'wood' ? '🪵' : '🪨')).join(' '); }
function startPlace(t) { if (!canAfford(BUILD[t].cost)) { msg(`${BUILD[t].ad} için yeterli malzeme yok (${costTxt(BUILD[t].cost)})`, '#e99', 3); return; } G.placing = t; msg(isTouch ? `${BUILD[t].ad}: Saldır düğmesiyle önüne yerleştir.` : `${BUILD[t].ad}: Tıklayarak yerleştir, sağ tık / Esc ile iptal.`, '#cde', 3); }
function cancelPlace() { G.placing = null; }
function placePos() {
  if (mouse.used && !isTouch) { const w = screenToWorld(mouse.x, mouse.y); const dx = w.x - L.x, dy = w.y - L.y, d = Math.hypot(dx, dy); if (d > 220) return { x: L.x + dx / d * 220, y: L.y + dy / d * 220 }; return w; }
  return { x: L.x + Math.cos(L.ang) * 60, y: L.y + Math.sin(L.ang) * 60 };
}
function placeOk(t, p) {
  const r = BUILD[t].r;
  if (p.x < 60 || p.y < 60 || p.x > WORLD - 60 || p.y > WORLD - 60) return false;
  if (Math.hypot(p.x - G.fire.x, p.y - G.fire.y) < 50 + r) return false;
  for (const o of gQuery(p.x, p.y, r + 10)) if (Math.hypot(o.x - p.x, o.y - p.y) < o.r + r - (o.kind === 'build' && t === 'cit' && o.type === 'cit' ? 14 : 0)) return false;
  for (const b of G.builds) if (b.type === 'tuzak' && Math.hypot(b.x - p.x, b.y - p.y) < 30 + r) return false;
  return true;
}
function tryPlace() {
  const t = G.placing; if (!t) return;
  const p = placePos();
  if (!placeOk(t, p)) { msg('Buraya inşa edilemez.', '#e99', 2); return; }
  if (!canAfford(BUILD[t].cost)) { msg('Malzeme bitti.', '#e99', 2); cancelPlace(); return; }
  pay(BUILD[t].cost);
  const b = { x: p.x, y: p.y, r: BUILD[t].r, kind: 'build', type: t, hp: BUILD[t].hp, maxhp: BUILD[t].hp, occ: [], uses: 3, ang: L.ang };
  G.builds.push(b); if (t !== 'tuzak') gAdd(b);
  SFX.build();
  if (t === 'kulube') msg(`Kulübe kuruldu. Nüfus sınırı: ${popCap()}`, '#cfe', 3);
  if (!canAfford(BUILD[t].cost) || t === 'kulube') cancelPlace();
}
function destroyBuild(b) {
  b.dead = true; gDel(b); G.builds.splice(G.builds.indexOf(b), 1);
  for (let i = 0; i < 14; i++) G.parts.push({ x: b.x + rand(-b.r, b.r), y: b.y + rand(-b.r, b.r), vx: rand(-80, 80), vy: rand(-80, 80), life: rand(0.5, 1), col: '#6a4a2a', s: rand(2, 5) });
  SFX.hit(0.5); noise(0.6, 0.4, 'lowpass', 800, 100);
  if (b.type === 'kulube') {
    msg('Bir kulübe parçalandı!', '#f88', 4);
    for (const p of b.occ) { p.inHut = null; p.x = b.x + rand(-20, 20); p.y = b.y + rand(-20, 20); p.fear = Math.min(100, p.fear + 50); }
  }
}
const popCap = () => 4 + 2 * G.builds.filter(b => b.type === 'kulube').length;
function craftSpear() {
  if (G.spear >= 2) { msg('Zaten taş mızrağın var.', '#ccc', 2); return; }
  const c = { wood: 5, stone: 10 }; if (!canAfford(c)) { msg('Taş mızrak için 5🪵 10🪨 gerek.', '#e99', 3); return; }
  pay(c); G.spear = 2; SFX.build(); msg('Taş uçlu mızraklar hazır! Halkın da daha sert vuruyor.', '#cfe', 4);
}
function craftTorch() {
  const c = { wood: 6 }; if (!canAfford(c)) { msg('El meşalesi için 6🪵 gerek.', '#e99', 3); return; }
  pay(c); G.torchOwned = true; G.torchOn = true; G.torchFuel = 60; SFX.build(); msg('Meşale yandı. [T] ile söndür/yak. Odun tüketir.', '#fda', 4);
}
function toggleTorch() {
  if (!G.torchOwned) { craftTorch(); return; }
  if (!G.torchOn && G.torchFuel <= 0) { if (G.stock.wood < 1) { msg('Meşale için odun yok!', '#e99', 2); return; } G.stock.wood--; G.torchFuel = 30; }
  G.torchOn = !G.torchOn; SFX.crackle(0.3);
}

// ------------------------------------------------------------- hareket ve çarpışma
function pushOut(e, isDino) {
  let blocked = null;
  const q = gQuery(e.x, e.y, e.r + 4);
  for (const o of q) {
    if (o.kind === 'build' && !isDino) continue;
    if (o.dead) continue;
    const dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy) || 0.01, m = o.r + e.r;
    if (d < m) { e.x = o.x + dx / d * m; e.y = o.y + dy / d * m; if (o.kind === 'build') blocked = o; }
  }
  e.x = clamp(e.x, 30, WORLD - 30); e.y = clamp(e.y, 30, WORLD - 30);
  return blocked;
}
function steer(e, tx, ty, spd, dt, isDino) {
  let dx = tx - e.x, dy = ty - e.y; const d = Math.hypot(dx, dy);
  if (d < 3) { e.moving = false; return true; }
  dx /= d; dy /= d;
  if (e.detour) { const px = -dy * e.detour, py = dx * e.detour; dx = dx * 0.4 + px; dy = dy * 0.4 + py; const m = Math.hypot(dx, dy); dx /= m; dy /= m; }
  const s = Math.min(spd * dt, d);
  const ox = e.x, oy = e.y;
  e.x += dx * s; e.y += dy * s;
  const bl = pushOut(e, isDino); if (isDino) e.bash = bl;
  const moved = Math.hypot(e.x - ox, e.y - oy);
  if (moved < s * 0.3 && !bl) { e.stuck += dt; if (e.stuck > 0.25) { e.detour = Math.random() < 0.5 ? 1 : -1; e.stuck = -0.7; } }
  else if (e.stuck < 0) { e.stuck += dt; if (e.stuck >= 0) e.detour = 0; }
  else e.stuck = Math.max(0, e.stuck - dt);
  e.ang = angLerp(e.ang, Math.atan2(dy, dx), Math.min(1, dt * 10));
  e.moving = true;
  return d < 8;
}
function separate(list, dt) {
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j]; if (a.inHut || b.inHut || a.grabbed || b.grabbed) continue;
    const dx = b.x - a.x, dy = b.y - a.y, m = a.r + b.r; if (Math.abs(dx) > m || Math.abs(dy) > m) continue;
    const d = Math.hypot(dx, dy) || 0.01; if (d < m) { const k = (m - d) / d * 0.5; const wa = b.r / m, wb = a.r / m; a.x -= dx * k * wa; a.y -= dy * k * wa; b.x += dx * k * wb; b.y += dy * k * wb; }
  }
}

// ------------------------------------------------------------- hasar / ölüm
function spearDmg(p) { return p.leader ? (G.spear === 2 ? 30 : 18) : (G.spear === 2 ? 13 : 8); }
function hurt(t, dmg, src) {
  if (t.dead) return;
  if (t.type) { // dinozor
    t.hp -= dmg; t.hurt = 0.15;
    for (let i = 0; i < 5; i++) G.parts.push({ x: t.x, y: t.y, vx: rand(-120, 120), vy: rand(-120, 120), life: rand(0.3, 0.7), col: '#7a0d0d', s: rand(2, 4) });
    if (t.carry && src && src.leader) { t.carryDmg += dmg; if (t.carryDmg >= 70) dropCarry(t, true); }
    if (t.type === 'boynuzlu' && !t.tamed) {
      if (t.ko > 0) { t.hp = 0; }
      else { t.angry = 18; t.tgt = src; if (!t.koDone && t.hp > 0 && t.hp < t.maxhp * 0.3) { t.ko = 30; t.koDone = true; t.angry = 0; msg('Boynuzlu bayıldı! [E] basılı tut: 15🍖 ile evcilleştir — ya da vur ve et al.', '#fe9', 6); } }
    }
    if (t.type !== 'boynuzlu' && src && !t.leave) { t.tgt = src; t.engaged = true; }
    if (t.type === 'kucuk' && t.hp < t.maxhp * 0.5) { t.leave = true; }
    if (t.hp <= 0) killDino(t);
    return;
  }
  // insan
  t.hp -= dmg; t.hurtT = 0.2; t.lastHurt = 0; t.fear = Math.min(100, t.fear + 12);
  for (let i = 0; i < 6; i++) G.parts.push({ x: t.x, y: t.y, vx: rand(-100, 100), vy: rand(-100, 100), life: rand(0.3, 0.8), col: '#9a1010', s: rand(2, 4) });
  if (t === L) { G.red = 0.6; G.shake = Math.max(G.shake, 8); }
  if (t.hp <= 0) killPerson(t, src);
}
function killDino(d) {
  d.dead = true;
  const def = DINO[d.type];
  if (d.carry) dropCarry(d, false);
  if (!d.tamed) { G.kills++; addStock('food', def.meat, d.x, d.y); }
  if (d.type === 'dev') { msg('DEV KAFA DÜŞTÜ! Halkın sana hayranlıkla bakıyor.', '#ffb060', 7); for (const p of G.people) p.fear = 0; SFX.roar(0.4); }
  if (d.tamed) msg('Evcil Boynuzlu öldü...', '#f99', 4);
  for (let i = 0; i < 16; i++) G.parts.push({ x: d.x, y: d.y, vx: rand(-150, 150), vy: rand(-150, 150), life: rand(0.5, 1.2), col: '#6a0808', s: rand(2, 6) });
  G.dinos.splice(G.dinos.indexOf(d), 1);
}
function killPerson(p, src) {
  if (p.dead) return; p.dead = true; G.deaths++;
  const i = G.people.indexOf(p); if (i >= 0) G.people.splice(i, 1);

// ------------------------------------------------------------- doğurma (spawn)

}
function spawnPack(type, n, pos) {

}

// ------------------------------------------------------------- gün döngüsü
function newDay() {
  G.day++; G.flags = {}; G.devDone = false; G.leaveDone = false;
  const humans = G.people.length, tamed = G.dinos.filter(d => d.tamed).length;
  const need = humans * 2 + tamed * 3;
  if (G.stock.food >= need) { G.stock.food -= need; msg(`☀️ ${G.day}. Gün. Hayattasınız. Halk ${need}🍖 yedi.`, '#ffe6a0', 6); }
  else {
    G.stock.food = 0; msg(`☀️ ${G.day}. Gün... ama yiyecek yetmedi. Açlık herkesi zayıflattı!`, '#f99', 6);
    for (const p of G.people.slice()) { hurt(p, 18, null); }
  }
  SFX.bell();
  // yeni gelenler
  if (G.people.length > 0 && G.people.length < popCap() && G.stock.food >= need) {
    const k = Math.random() < 0.65 ? 1 : 0, k2 = G.day > 3 && Math.random() < 0.3 ? 1 : 0;
    for (let i = 0; i < k + k2 && G.people.length < popCap(); i++) {
      const a = rand(0, TAU); const p = mkPerson(CAMP.x + Math.cos(a) * 380, CAMP.y + Math.sin(a) * 380, freshName(), false); p.fear = 30; G.people.push(p);
      msg(`${p.name} gece ateşinizi görmüş ve halkınıza katıldı.`, '#9f9', 6);
    }
  } else if (G.people.length >= popCap()) msg('Yeni gelenler için yer yok. Kulübe inşa et.', '#ccc', 5);
  G.rescueAt = Math.random() < 0.55 ? rand(0.1, 0.3) : -1;
  buildPList();
}

  if (p > 0.48 && !f.b) { f.b = 1; msg('Hava kararıyor... Herkes ateşin başına.', '#f9a070', 5); SFX.sting(); }
  if (p > 0.62 && !f.c) { f.c = 1; if (G.day === 1) msg('Karanlıkta parlayan gözler var. Ateşten uzaklaşma.', '#e88', 6); }

      SFX.scream(0.25, clamp((pos.x - L.x) / 900, -1, 1));
      if (Math.random() < 0.7) { const a = rand(0, TAU); spawnPack('kucuk', ri(2, 3), { x: pos.x + Math.cos(a) * 380, y: pos.y + Math.sin(a) * 380 }); }

// ------------------------------------------------------------- ana güncelleme
function update(dt) {
  G.now += dt; G.dt = dt;
  const prevP = phase(); G.t += dt; if (phase() < prevP) newDay();
  const LS = lights(), zones = safeZones();
  // ateş
  G.fire.fuel = Math.max(0, G.fire.fuel - dt * (isNight() ? 0.3 : 0.14));
  G.stokeT -= dt;
  if (G.stokeT <= 0) {
    G.stokeT = 1;
    if (G.fire.fuel < 70 && G.stock.wood > 0 && G.people.some(p => !p.leader && !p.inHut && !p.grabbed && dist(p, G.fire) < 160 && p.fear < 85)) { G.stock.wood--; G.fire.fuel = Math.min(100, G.fire.fuel + 9); }
  }
  if (G.fire.fuel <= 0 && !G.fire.out) { G.fire.out = true; msg('ATEŞ SÖNDÜ! Karanlık her yerde...', '#ff4030', 6); SFX.sting(); }
  if (G.fire.fuel > 0 && G.fire.out) { G.fire.out = false; msg('Ateş yeniden canlandı.', '#fd9', 3); }
  // çalılar yeniden büyür
  G.regrowT -= dt; if (G.regrowT <= 0) { G.regrowT = 2; if (!isNight()) for (const b of G.bushes) if (b.food < b.max && Math.random() < 0.03) b.food++; }

  updLeader(dt);
  for (const p of G.people.slice()) if (p !== L && !p.dead) updPerson(p, dt, LS, zones);
  const prey = preyList();
  for (const d of G.dinos.slice()) if (!d.dead) updDino(d, dt, prey, zones);
  separate(G.people, dt); separate(G.dinos, dt);
  for (const p of G.people) if (!p.inHut && !p.grabbed) pushOut(p, false);

  G.spawnT -= dt; if (G.spawnT <= 0) { G.spawnT = 1.5; spawner(); }
  for (const d of G.dinos.slice()) if (!d.tamed && !d.carry && L && dist(d, L) > 2100 && dist(d, G.fire) > 2000) { d.dead = true; G.dinos.splice(G.dinos.indexOf(d), 1); }
  timeEvents();

  // tehlike → kalp atışı
  let danger = 0;
  for (const d of G.dinos) { if (d.tamed || (d.type === 'boynuzlu' && !d.angry)) continue; const rr = d.type === 'dev' ? 900 : d.type === 'yirtici' ? 420 : 220; danger = Math.max(danger, 1 - dist(d, L) / rr); }

  G.hbT -= dt; if (G.danger > 0.15 && G.hbT <= 0) { G.hbT = 1.1 - G.danger * 0.65; SFX.heart(0.25 + G.danger * 0.5); }
  // ortam sesleri
  if (A.ctx) {
    const n = darkness(); A.wind.gain.setTargetAtTime(0.04 + n * 0.06, A.ctx.currentTime, 1); A.drone.gain.setTargetAtTime(n * 0.05 + G.danger * 0.08, A.ctx.currentTime, 1);

    if (G.ambT <= 0) {

      if (isNight()) { if (Math.random() < 0.5) SFX.rustle(rand(0.1, 0.3), rand(-1, 1)); if (Math.random() < 0.15) { SFX.screech(0.06, rand(-1, 1)); } if (Math.random() < 0.08 && G.day >= 2) msg(pick(['Çalılarda bir şey kıpırdadı...', 'Bir dal kırıldı. Çok yakında.', 'Biri... nefes mi alıyor?', 'Gözler. Ateşin ötesinde gözler.']), '#998', 3); }
      else { if (Math.random() < 0.6) SFX.bird(); }

  }

  G.parts = G.parts.filter(q => q.life > 0);
  if (G.fire.fuel > 0 && Math.random() < dt * 14) G.parts.push({ x: G.fire.x + rand(-10, 10), y: G.fire.y - 5, vx: rand(-15, 15), vy: rand(-90, -40), life: rand(0.5, 1.4), col: pick(['#ffb040', '#ff7020', '#ffe080']), s: rand(1, 2.5), ember: 1 });
  for (const t of G.texts) { t.y -= 25 * dt; t.life -= dt; } G.texts = G.texts.filter(t => t.life > 0);
  if (G.stains) { for (const s of G.stains) s.life -= dt; G.stains = G.stains.filter(s => s.life > 0); }

  let ch = false; for (const m of G.msgs) { m.life -= dt; } const before = G.msgs.length; G.msgs = G.msgs.filter(m => m.life > 0); if (G.msgs.length !== before) ch = true;
  G.uiT -= dt; if (G.uiT <= 0) { G.uiT = 0.15; updateHUD(); renderMsgs(); }
}

// ------------------------------------------------------------- çizim

    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.95, r * 0.52, 0, 0, TAU); ctx.fill();
    // sırt çizgisi / çizgiler
    ctx.strokeStyle = dk; ctx.lineWidth = Math.max(1, r * 0.08);
    if (d.type === 'yirtici') { for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * r * 0.25, -r * 0.4); ctx.lineTo(i * r * 0.25 - r * 0.1, r * 0.4); ctx.stroke(); } }
    else { ctx.beginPath(); ctx.moveTo(-r * 1.6, sway * 0.7); ctx.quadraticCurveTo(-r * 0.6, 0, r * 0.7, 0); ctx.stroke(); }
    // kollar
    if (d.type === 'dev') { ctx.fillStyle = dk; ctx.beginPath(); ctx.arc(r * 0.7, -r * 0.3, r * 0.08, 0, TAU); ctx.arc(r * 0.7, r * 0.3, r * 0.08, 0, TAU); ctx.fill(); }
    else { ctx.strokeStyle = dk; ctx.lineWidth = Math.max(1.5, r * 0.1); ctx.beginPath(); ctx.moveTo(r * 0.5, -r * 0.35); ctx.lineTo(r * 0.85, -r * 0.45); ctx.moveTo(r * 0.5, r * 0.35); ctx.lineTo(r * 0.85, r * 0.45); ctx.stroke(); }
    // boyun + baş
    const hl = d.type === 'dev' ? 1.0 : 0.85, hw = d.type === 'dev' ? 0.62 : 0.45, hh = d.type === 'dev' ? 0.42 : 0.28;
    ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(r * hl, 0, r * hw, r * hh, 0, 0, TAU); ctx.fill();
    const jaw = d.atkCd > def.cd * 0.6 || d.carry ? 0.18 : 0.04;
    ctx.fillStyle = shade(col, -0.2); ctx.beginPath(); ctx.moveTo(r * (hl + 0.1), -r * jaw); ctx.lineTo(r * (hl + hw), 0); ctx.lineTo(r * (hl + 0.1), r * jaw); ctx.fill();
    if (d.type === 'dev') { ctx.fillStyle = '#eee'; for (let i = 0; i < 5; i++) { ctx.fillRect(r * (hl + 0.05 + i * 0.1), -r * 0.24, 2, 4); ctx.fillRect(r * (hl + 0.05 + i * 0.1), r * 0.24 - 4, 2, 4); } }
    // gözler (gündüz)
    ctx.fillStyle = darkness() > 0.5 ? def.eye : '#111'; const ex = r * (hl + hw * 0.2), ey = r * hh * 0.6;
    ctx.beginPath(); ctx.arc(ex, -ey, Math.max(1.3, r * 0.07), 0, TAU); ctx.arc(ex, ey, Math.max(1.3, r * 0.07), 0, TAU); ctx.fill();
  }
  ctx.restore();
  if ((d.hp < d.maxhp && d.type !== 'kucuk') || d.tamed) hpBar(d.x, d.y - r - 12, d.hp / d.maxhp, Math.max(26, r * 1.4));
  if (d.tamed) { ctx.fillStyle = '#9f9'; ctx.font = '11px Georgia'; ctx.textAlign = 'center'; ctx.fillText('♥', d.x, d.y - r - 16); }
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

// ------------------------------------------------------------- HUD
function updateHUD() {
  const p = phase(), n = isNight();
  $('dayTxt').textContent = `${G.day}. Gün`;
  $('todTxt').textContent = n ? '🌑 Gece' : p > 0.42 ? '🌇 Akşam' : '☀️ Gündüz';
  $('todBar').style.width = (p * 100) + '%';
  $('rWood').textContent = G.stock.wood; $('rStone').textContent = G.stock.stone; $('rFood').textContent = G.stock.food;
  $('rPop').textContent = `${G.people.length}/${popCap()}`;
  $('fireBar').style.width = G.fire.fuel + '%';
  $('hpBar').style.width = clamp(L.hp / L.maxhp * 100, 0, 100) + '%';
  $('stBar').style.width = L.stam + '%';
  const it = G.interact;
  $('prompt').textContent = G.placing ? `${BUILD[G.placing].ad} yerleştiriliyor` : it ? (isTouch ? '[Topla] ' : '[E] ') + it.label : '';
  for (const b of document.querySelectorAll('#tools button[data-b]')) { b.classList.toggle('on', G.placing === b.dataset.b); b.classList.toggle('no', !canAfford(BUILD[b.dataset.b].cost)); }
  $('cMizrak').classList.toggle('no', G.spear >= 2); if (G.spear >= 2) $('cMizrak').innerHTML = '🗡️ Taş Mızrak<br><small>hazır ✓</small>';
  $('cTorch').classList.toggle('on', G.torchOn);
  if (G.torchOwned) $('cTorch').innerHTML = `🔥 Meşale ${G.torchOn ? 'açık' : 'kapalı'}<br><small>[T]</small>`;
  // halk listesi
  for (const p2 of G.people) {
    if (p2.leader) continue; const row = document.getElementById('pr' + p2.id); if (!row) { buildPList(); return; }
    row.querySelector('.hpb').style.width = (p2.hp / p2.maxhp * 100) + '%';
    row.querySelector('.feb').style.width = p2.fear + '%';
    const jb = row.querySelector('.job'); if (jb.textContent !== JOBL[p2.job]) jb.textContent = JOBL[p2.job];
    row.querySelector('.st').textContent = p2.grabbed ? '😱 kapıldı!' : p2.desert > 0 ? '🏃 kaçıyor' : p2.inHut ? '💤' : p2.fear >= 80 ? '😨 panik' : '';
  }
}
function buildPList() {
  const rows = G.people.filter(p => !p.leader).map(p => `<div class="pr" id="pr${p.id}"><span><span class="nm">${p.name}</span> <span class="st"></span></span><button class="job" data-id="${p.id}">${JOBL[p.job]}</button><div class="bars"><div class="bar"><i class="hpb" style="background:#c44"></i></div><div class="bar fear"><i class="feb"></i></div></div></div>`);
  const tamed = G.dinos.filter(d => d.tamed).length;
  $('plist').innerHTML = `<div class="pr" style="color:#ffcf9a"><span>👑 ${L ? L.name : ''} (sen)</span><span>${tamed ? '🦕×' + tamed : ''}</span></div>` + (rows.join('') || '<div class="pr" style="color:#a89a80">Yalnızsın.</div>') + `<div class="pr" style="color:#a89a80;font-size:10px">kırmızı: can · yeşil→kırmızı: korku</div>`;
}

// ------------------------------------------------------------- ekranlar
function best() { try { return +localStorage.getItem('sonAtesRekor') || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('sonAtesRekor', v); } catch (e) { } }
function startScreen() {
  G.started = false;
  $('screenBox').innerHTML = `<h1>SON ATEŞ</h1>
  <p class="story">Bir fırtına. Kör edici bir ışık. Uyandığınızda gökyüzünde tanımadığınız kanatlar,<br>ormanda tanımadığınız sesler vardı.<br>Dört kişisiniz. Bir ateşiniz var.<br><b>Ve gece yaklaşıyor.</b></p>
  <div class="keys">${isTouch ? `<b>Sol taraf</b> — hareket (sanal kol)<br><b>Saldır</b> — mızrak (en yakın düşmana nişan)<br><b>Topla/Kullan</b> — odun, taş, meyve, ateşe odun, evcilleştir<br><b>Koş · Meşale</b>` : `<b>WASD / Oklar</b> — hareket · <b>Shift</b> — koş<br><b>Fare / Boşluk</b> — mızrakla saldır<br><b>E (basılı)</b> — topla · ateşe odun at · evcilleştir · kurtar<br><b>1-4</b> — inşa et · <b>T</b> — el meşalesi · <b>P</b> — duraklat`}<br>
  <b>Halk</b> — sağ panelden herkese iş ver: odun, taş, yiyecek, muhafız, takip<br>
  <b>Kural</b> — ateş sönerse, karanlıktaki her şey cesaretlenir.</div><br>
  ${best() ? `<p>En uzun hayatta kalma: <b>${best()} gün</b></p>` : ''}
  <button id="go">ATEŞİ YAK</button><p style="font-size:12px;color:#776">🎧 Kulaklıkla oyna.</p>`;
  $('screen').style.display = 'flex';
  $('go').onclick = () => { audioInit(); $('screen').style.display = 'none'; $('hud').style.display = 'block'; newGame(); };
}
function gameOver() {
  G.over = true;
  const d = G.day; if (d > best()) setBest(d);
  setTimeout(() => {
    $('screenBox').innerHTML = `<h1 style="color:#c33;text-shadow:0 0 30px #600">KARANLIK</h1>
    <p class="story">Ateşin son közü de söndü. Ormanın sesleri, sanki hiçbir şey olmamış gibi devam etti.</p>
    <p><b>${d}</b> gün hayatta kaldınız · <b>${G.kills}</b> yaratık avlandı · <b>${G.deaths}</b> kişi öldü · <b>${G.lost}</b> kişi karanlıkta kayboldu</p>
    <p>Rekor: <b>${best()} gün</b></p><button id="go">YENİDEN DENE</button>`;
    $('screen').style.display = 'flex'; $('hud').style.display = 'none';
    $('go').onclick = () => { $('screen').style.display = 'none'; $('hud').style.display = 'block'; newGame(); };
  }, 2500);
}

// ------------------------------------------------------------- döngü
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (G.started && L) {
    if (!G.paused && !G.over) update(dt);
    render();
  }
  requestAnimationFrame(loop);
}
makeGround();
startScreen();
requestAnimationFrame(loop);
// test için
window.__G = G; window.__getL = () => L;
</script>
</body>
