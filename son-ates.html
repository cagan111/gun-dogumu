<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Son Ateş">
<title>Son Ateş</title>
<style>
:root{--ink:#f1e6cf;--muted:#a89a80;--panel:rgba(14,12,10,.82);--line:rgba(241,230,207,.14);--fire:#ff8a2a;--bg:#050505}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
button{font-family:Georgia,serif;color:var(--ink);cursor:pointer}
.bar{position:relative;height:7px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;flex:1;min-width:40px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:50%;background:#7c6;border-radius:4px;transition:width .15s}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#top{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:220px;font-size:13px}
#top.kapali{min-width:0;padding:6px 10px;cursor:pointer}#top.kapali>*{display:none!important}#top.kapali::after{content:"📊";font-size:18px}
#top .row{display:flex;align-items:center;gap:8px}
#res,#res2{display:flex;gap:9px;font-size:13px;flex-wrap:wrap}
#res2{font-size:12px;color:#d8ccb4;gap:7px}
#fireBar{background:linear-gradient(90deg,#c33,#f80,#fd4)}
#morBar{background:linear-gradient(90deg,#a44,#cc5,#6c6)}
#todBar{background:linear-gradient(90deg,#fd6,#88a)}
#miniBox{position:absolute;left:10px;top:150px;pointer-events:auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;cursor:pointer}
#miniBox.big{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);z-index:3;box-shadow:0 0 40px #000;cursor:crosshair}
#mapClose,#mapHint{display:none;position:absolute;background:rgba(0,0,0,.7);color:#ffd27a;font-size:14px;border-radius:6px}
#mapClose{right:6px;top:6px;padding:4px 10px;cursor:pointer}
#mapHint{left:6px;bottom:6px;padding:3px 8px;font-size:12px;pointer-events:none}
#miniBox.big #mapClose,#miniBox.big #mapHint{display:block}
#tutBox{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;background:rgba(40,28,10,.92);border:1px solid #c88a40;border-radius:8px;padding:7px 12px;font-size:14px;max-width:min(92vw,560px);pointer-events:auto;display:none;text-align:center}
#tutBox button{margin-left:8px;background:#3a2810;border:1px solid #7a5a30;border-radius:5px;font-size:12px;padding:2px 8px}
#msgs{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:min(58vw,560px)}
#msgs div{background:rgba(0,0,0,.62);padding:5px 12px;border-radius:6px;font-size:14px;text-align:center}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none}
#toast div{background:rgba(50,36,8,.95);border:1px solid #e0b050;color:#ffe2a0;padding:8px 16px;border-radius:8px;font-size:14px;animation:tin .4s}
@keyframes tin{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
#side{position:absolute;right:10px;top:10px;width:300px;background:var(--panel);border:1px solid var(--line);border-radius:10px;pointer-events:auto;font-size:12px;max-height:calc(100vh - 190px);display:flex;flex-direction:column}
#sideHead{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px;letter-spacing:.08em;flex:none}
#sideBody{overflow:auto;flex:1;min-height:0}
#side.closed #sideBody{display:none}
#side.closed{width:auto}
#tabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(14,12,10,.97);z-index:1}
#tabs button,.chips button,.bulk button,.gb button,.btns button{background:#2b2419;border:1px solid #5a4a30;border-radius:5px;font-size:12px;padding:3px 7px;line-height:1.2}
#tabs button{flex:1;padding:5px}
#tabs button.on,.chips button.on,.gb button.on,.btns button.on{border-color:var(--fire);background:#4a2a10}
.gb button.no{opacity:.45}
.grp{padding:6px 9px;border-bottom:1px solid rgba(255,255,255,.06)}
.gh{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px}
.gm{color:#ffd27a;font-size:12px}
.gm i{color:var(--muted)}
.gb{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.gb button{min-width:30px}
.gb .ab{flex:1;text-align:left}
.hint{color:var(--muted);font-size:11px}
.note{padding:6px 9px;color:#cbbd9f;font-size:12px;border-bottom:1px solid rgba(255,255,255,.06)}
.chips,.bulk{display:flex;gap:3px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06);align-items:center}
.bulk span{font-size:11px;color:#ffd27a;margin:0 2px}
.pr{display:grid;grid-template-columns:1fr auto;gap:3px 6px;padding:5px 9px;border-bottom:1px solid rgba(255,255,255,.05)}
.pr.sel{background:rgba(255,160,60,.12)}
.pr .nmw{cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pr .nm{font-weight:bold}
.pr .trs{font-size:11px}
.pr .btns{display:flex;gap:3px}
.pr .bars{grid-column:1/3;display:flex;gap:4px}
.pr .bars .bar{height:4px}
.pr .fear i{background:linear-gradient(90deg,#6a6,#d33)}
.pr .info{grid-column:1/3;font-size:11px;color:#d8ccb4;line-height:1.5;background:rgba(0,0,0,.25);padding:5px;border-radius:5px}
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px 8px}
#prompt{font-size:14px;background:rgba(0,0,0,.6);padding:4px 12px;border-radius:6px}
#prompt:empty{display:none}
#bars{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;width:min(420px,94vw)}
#hpBar{background:linear-gradient(90deg,#922,#e44)}
#stBar{background:linear-gradient(90deg,#aa7,#ee9)}
#tools{display:flex;gap:5px;pointer-events:auto;overflow-x:auto;max-width:100%;padding-bottom:2px}
#tools button{flex:none;background:var(--panel);border:1px solid #5a4a30;border-radius:8px;font-size:12px;padding:5px 8px;white-space:nowrap;line-height:1.25}
#tools button small{color:var(--muted)}
#tools button.on{border-color:var(--fire);box-shadow:0 0 8px rgba(255,138,42,.5)}
#tools button.no{opacity:.45}
#tools button.hl{border-color:#c88a40}
#craft{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:4;pointer-events:auto}
#craftBox{background:#15110c;border:1px solid #6a5030;border-radius:12px;width:min(640px,94vw);max-height:86vh;display:flex;flex-direction:column}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch .res{flex:1;font-size:12px;color:#d8ccb4}
.ch button{background:#2b2419;border:1px solid #5a4a30;border-radius:6px;padding:3px 10px}
.cl{overflow:auto;padding:6px 12px 12px;touch-action:pan-y}
.cat{color:#ffb067;font-size:13px;letter-spacing:.1em;margin:10px 0 4px;text-transform:uppercase}
.card{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 9px;border:1px solid rgba(255,255,255,.08);border-radius:8px;margin-bottom:5px;font-size:13px}
.card small{color:#cbbd9f}
.card .bad{color:#f88}
.card.done{opacity:.55}
.card.locked{opacity:.6}
.card button{background:#3a1d0b;border:1px solid #c66a25;border-radius:6px;padding:5px 12px;flex:none}
.card button.no{opacity:.45}
.card .ok{color:#9e9;font-size:18px}
#sideBody{touch-action:pan-y}
.modalw{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:4;pointer-events:auto}
#inBox{background:#15110c;border:1px solid #6a5030;border-radius:12px;width:min(724px,96vw);max-height:92vh;overflow:auto;padding:10px 12px;font-size:13px}
#inBox canvas{display:block;margin:0 auto;border-radius:8px;cursor:pointer}
#inBox button{background:#2b2419;border:1px solid #5a4a30;border-radius:6px;padding:4px 9px;font-size:12px}
#inBox .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:16px;padding:6px 10px;opacity:.85}
#inBox .nav.l{left:4px}#inBox .nav.r{right:4px}
#charM{z-index:6}
#charBox{background:#15110c;border:1px solid #6a5030;border-radius:12px;width:min(520px,94vw);max-height:88vh;display:flex;flex-direction:column;font-size:13px}
#charBox button,.ctabs button,.obtns button{background:#2b2419;border:1px solid #5a4a30;border-radius:6px;padding:4px 9px;font-size:12px}
#charBox button.on,.ctabs button.on{border-color:var(--fire);background:#4a2a10}
#charBox button.no{opacity:.45}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.story2{font-style:italic;color:#c8b898;margin:8px 0 2px}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.sk{display:grid;grid-template-columns:1fr auto;gap:2px 6px;font-size:12px}
.sk .bar{grid-column:1/3;height:4px}
.sk.cur span{color:#ffd27a}
.gsel{display:flex;flex-wrap:wrap;gap:4px}
button.wide{width:100%;margin-top:6px}
.ctabs{display:flex;gap:6px;padding:8px 12px 0}
.obtns{display:flex;gap:3px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.card .obtns button{padding:4px 7px;background:#2b2419;border-color:#5a4a30}
#touch{display:none;position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:0;bottom:0;width:50%;height:62%;pointer-events:auto}
#knobBase{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:none}
#knob{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.22);left:31px;top:31px}
#tbtns{position:absolute;right:10px;bottom:120px;display:grid;grid-template-columns:repeat(3,58px);gap:8px;pointer-events:auto}
#tbtns div{width:58px;height:58px;border-radius:50%;background:rgba(20,16,12,.72);border:2px solid rgba(255,200,140,.35);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;line-height:1.1}
#tbtns div.act{background:rgba(120,60,20,.82)}
#pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);font-size:32px;z-index:4;letter-spacing:.2em}
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 70%,#2a1408 0%,#050403 70%);z-index:5;padding:20px;overflow:auto;touch-action:pan-y}
#screen .box{max-width:600px;text-align:center;margin:auto}
#screen h1{font-size:clamp(44px,11vw,84px);margin:0;letter-spacing:.12em;color:#ffb067;text-shadow:0 0 30px rgba(255,100,20,.6),0 0 4px #000}
#screen p{color:#d8c8a8;line-height:1.6;font-size:15px}
#screen .story{font-style:italic;color:#bba98a}
#screen button{margin-top:10px;background:#2a160a;color:#ffd2a0;border:1px solid #8a4a20;padding:8px 22px;font-size:15px;border-radius:8px;letter-spacing:.06em}
#screen button.big{background:#3a1d0b;border-color:#c66a25;padding:12px 34px;font-size:19px;letter-spacing:.1em}
#screen button:hover{background:#5a2a0e}
.diffs{display:flex;gap:6px;justify-content:center;margin-top:14px}
.diffs button.on{border-color:#ffb067!important;background:#5a2a0e!important}
.ddesc{font-size:13px!important;color:#a89a80!important;margin:6px 0!important}
.chk{font-size:14px;color:#d8c8a8}
details{text-align:left;margin-top:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
summary{cursor:pointer;color:#e8d4b0}
.keys{font-size:13px;color:#a89a80;line-height:1.7;margin-top:6px}
.keys b{color:#e8d4b0}
.achs{font-size:13px;color:#776;line-height:1.7}
.achs .got{color:#ffe2a0}
@media (max-width:700px){
  #side{width:min(270px,64vw);font-size:11px;max-height:calc(100vh - 260px)}
  #top{min-width:0;font-size:12px;padding:6px 8px;max-width:46vw}
  #res{gap:6px;font-size:12px}#res2{font-size:11px}
  #msgs{top:auto;bottom:250px;width:92vw}#msgs div{font-size:12px}
  #miniBox{top:auto;bottom:250px}
  #tutBox{bottom:auto;top:185px;left:8px;transform:none;max-width:46vw;font-size:12px;text-align:left}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="top">
    <div class="row"><b id="dayTxt">1. Gün</b><span id="todTxt">☀️</span><div class="bar"><i id="todBar"></i></div></div>

<script>
'use strict';
// =============================================================
//  SON ATEŞ — temel: yardımcılar, sabitler, veri tanımları
// =============================================================
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const angTo = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
function angLerp(a, b, t) { const d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI; return a + d * t; }
const angDiff = (a, b) => Math.abs(((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI);
const $ = id => document.getElementById(id);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- Türkçe ek uyumu
function lastV(w) { const m = w.toLocaleLowerCase('tr').match(/[aeıioöuü](?=[^aeıioöuü]*$)/); return m ? m[0] : 'e'; }
function harm(w) { const v = lastV(w); return 'aı'.includes(v) ? 'ı' : 'ei'.includes(v) ? 'i' : 'ou'.includes(v) ? 'u' : 'ü'; }
const endsV = w => /[aeıioöuü]$/i.test(w);
const gen = w => w + "'" + (endsV(w) ? 'n' : '') + harm(w) + 'n';
const acc = w => w + "'" + (endsV(w) ? 'y' : '') + harm(w);
const cop = w => w + "'s" + harm(w) + 'n';
const dat = w => w + "'" + (endsV(w) ? 'y' : '') + ('aıou'.includes(lastV(w)) ? 'a' : 'e');
const cap1 = s => s[0].toLocaleUpperCase('tr') + s.slice(1);
function compass(a) { const d = ['doğu', 'güneydoğu', 'güney', 'güneybatı', 'batı', 'kuzeybatı', 'kuzey', 'kuzeydoğu']; return d[Math.round((((a % TAU) + TAU) % TAU) / (TAU / 8)) % 8]; }

// ---- dünya sabitleri
const WORLD = 6000, CAMP = { x: 3000, y: 3000 }, CYCLE = 300;
const MAPN = 100, MAPC = WORLD / MAPN;

const NAMES = ['Arda','Ece','Toprak','Deniz','Kaya','Ilgın','Bora','Su','Tan','Yağmur','Doruk','Nehir','Çınar','Defne','Alp','Elif','Umut','Ay','Bulut','Duru','Ege','Lale','Oğuz','Selin','Yiğit','Mert','Zeynep','Kuzey','Asya','Poyraz','Rüzgar','Sema','Ozan','Ada','Kartal','Pınar','Barış','Cemre','Dilan','Eren','Feride','Gökay','Hazal','İlkay','Jale','Kerem','Leyla','Melis','Nazlı','Orhan','Pelin','Reşat','Sarp','Şule','Tuna','Ufuk','Vedat','Yasemin','Zafer','Aslı','Berk','Ceren','Dağhan','Esin','Fırat','Gizem','Harun','Irmak','Koray','Mira','Nil','Okan','Serra','Tolga','Volkan','Yaren','Ahu','Batu','Cansu','Demir','Ebru','Filiz','Gökhan','Hande','Işıl','Kaan','Lara','Meltem','Nur','Onur','Pars','Rana','Sevgi','Tamer','Ülkü','Yavuz','Zerrin','Atlas','Bengü','Cihan','Derin','Emre','Funda','Gül','Hakan','İpek','Kıvanç','Mavi','Nehir Su','Özge','Rüya','Selim','Tuğçe','Uğur','Yonca'];
const STORIES = [
  { t: 'Fırtınadan önce veterinerdi.', sk: { sifa: 2, kasaplik: 2 } }, { t: 'Hemşireydi; kan görmekten korkmaz.', sk: { sifa: 3 } },
  { t: 'Kasaptı. Eti nasıl ayıracağını bilir.', sk: { kasaplik: 3 } }, { t: 'Avcıydı; dağlarda yaban domuzu avlardı.', sk: { avcilik: 3 } },
  { t: 'İnşaat ustası. Elleri nasırlı.', sk: { insaat: 3 } }, { t: 'Marangozdu.', sk: { zanaat: 3 } }, { t: 'Bir çiftlikte büyüdü.', sk: { tarim: 3 } },
  { t: 'Emekli bir asker. Az konuşur.', sk: { savas: 3 } }, { t: 'Eski bir dağcı. Yükseklikten korkmaz.', sk: { kesif: 3 } },
  { t: 'Ormancıydı; ağaçları sesinden tanır.', sk: { toplama: 3 } }, { t: 'Mimarlık öğrencisiydi.', sk: { insaat: 2 } },
  { t: 'Demirci çırağıydı.', sk: { zanaat: 2 } }, { t: 'Eczanede çalışıyordu. Otları tanır.', sk: { sifa: 2 } },
  { t: 'Aşçıydı; "her şeyi pişiririm" der.', sk: { asci: 3 } }, { t: 'Bir lokantada bulaşıkçıydı; mutfağı bilir.', sk: { asci: 2 } }, { t: 'Annesinin yemeklerini özlüyor; tariflerini ezbere bilir.', sk: { asci: 1, tarim: 1 } }, { t: 'Bahçıvandı.', sk: { tarim: 2 } },
  { t: 'Okçuluk kulübündeydi.', sk: { avcilik: 2 } }, { t: 'Taksi şoförüydü. Yön duygusu çok iyi.', sk: { kesif: 2 } },
  { t: 'Gece bekçisiydi. Karanlığa alışkın.', sk: { savas: 2 } }, { t: 'Balıkçıydı; suyun sesini dinler.', sk: { avcilik: 1, toplama: 1 } },

function updHunter(p, dt, thr) {

  }

    if (dd > want * 1.35) { steer(p, t.x + Math.cos(a) * want, t.y + Math.sin(a) * want, pSpeed(p) * 1.2, dt, false); p.anim += dt * 11; return; }
    p.moving = false; p.ang = angTo(p, t);
    if (p.atkCd <= 0) { p.atkCd = 1.15 / skillMul(lvl(p, 'avcilik')); p.swing = 0.2; shootArrow(p, t.x, t.y, arrowDmg(p)); addXP(p, 'avcilik', 2); }
    return;
  }
  const side = t.type === 'zirhli' ? Math.PI / 2 * (idx % 2 ? 1 : -1) : Math.PI + (idx - (n - 1) / 2) * 0.55;
  const a = t.ang + side, reach = t.r + p.r + 12;
  if (p.backT > 0) { p.backT -= dt; const fa = angTo(t, p); steer(p, p.x + Math.cos(fa) * 80, p.y + Math.sin(fa) * 80, pSpeed(p) * 1.3, dt, false); p.anim += dt * 12; return; }
  if (charging && dd < t.r + 90) { p.backT = 1.0; return; }

    steer(p, far ? t.x + Math.cos(a) * (reach + 20) : t.x, far ? t.y + Math.sin(a) * (reach + 20) : t.y, pSpeed(p) * 1.3, dt, false); p.anim += dt * 12; return;
  }

}
// ---- et ustası
function nearestCarcass(p) {
  let best = null, bs = 1e9;
  for (const c of G.carcs) {
    if (c.dead || c.meat + c.bone + c.hide <= 0 || c.rotten) continue;
    if (dist(c, G.fire) > 1900) continue;
    if (G.dinos.some(d => hostile(d) && d.type !== 'kucuk' && dist(d, c) < 220)) continue;
    const s = dist(c, p);
    if (s < bs) { bs = s; best = c; }
  }

}
function updButcher(p, dt, thr) {
  if (goHome() && !(p.carry > 0)) return homeBehavior(p, dt);

// ---- çiftçi
function updFarmer(p, dt) {
  if (goHome() && !(p.carry > 0)) return homeBehavior(p, dt);

    if (steer(p, G.fire.x + Math.cos(p.seat) * 55, G.fire.y + Math.sin(p.seat) * 55, pSpeed(p), dt, false) || dist(p, G.fire) < 70) { deposit(p); p.st = 'idle'; }

    if (p.tgt && p.tgt.claim === p) p.tgt.claim = null;

  if (Math.hypot(p.x - spot.x, p.y - spot.y) > 12) { steer(p, spot.x, spot.y, pSpeed(p), dt, false); p.anim += dt * 9; return; }
  p.moving = false; p.work += dt * workRate(p); p.anim += dt * 4;
  const need = job === 3 ? 6 : job === 2 ? 5 : 4;
  if (p.work >= need) {
    p.work = 0.01; f.claim = null; p.tgt = null;
    if (job === 3) { const n = Math.round(14 * skillMul(lvl(p, 'tarim'))); p.bag.meyve = (p.bag.meyve || 0) + n; p.carry += n; f.planted = false; f.g = 0; p.st = 'return'; addXP(p, 'tarim', 8); ftext(f.x, f.y - 20, 'Hasat!', '#ffe08a'); }
    else if (job === 2) { f.planted = true; f.g = 0; addXP(p, 'tarim', 3); }
    else { f.g = Math.min(1, f.g + 0.06 * skillMul(lvl(p, 'tarim'))); f.tendT = 30; addXP(p, 'tarim', 2); }

}
// ---- üretim (zanaatkâr / şifacı)
function canDoOrder(p, o) {
  const it = ITEMS[o.item];
  if (o.by && o.by !== p.id) return false;
  if (lvl(p, it.by) < it.lvl) return false;
  if (it.reqPop && G.people.length < it.reqPop) return false;
  if (o.worker && o.worker !== p.id && G.people.some(q => q.id === o.worker && q.group === p.group && !q.dead && !q.bed)) return false;
  return true;
}
function workOrder(p, dt, by, stn) {
  const o = G.orders.find(o => ITEMS[o.item].by === by && canDoOrder(p, o) && (o.paid || canAfford(ITEMS[o.item].cost)));
  if (!o) return false;
  o.worker = p.id;
  if (stn.kind === 'build') { if (!atStation(p, stn, dt)) return true; }
  else if (dist(p, stn) > (stn.r || 30) + 24) { steer(p, stn.x + Math.cos(p.seat) * 10, stn.y + (stn.r || 30) + 10, pSpeed(p), dt, false); p.anim += dt * 9; return true; }
  p.moving = false; p.ang = angTo(p, stn); p.work = 1;
  const it = ITEMS[o.item];

    if (o.left <= 0) G.orders.splice(G.orders.indexOf(o), 1);

}
function updCrafter(p, dt) {

// ---- mimar / inşaat
function blueprintFor(p) {

}
function updBuilder(p, dt, any) {

function assignPosts() {
  const guards = members('muhafiz').filter(p => !p.downed && !p.desert && !p.bed);

// ---- ölüm / ayrılma
function removePerson(p) {

function killPerson(p, src, silent) {
  if (p.dead) return;

    for (const g in G.managers) if (G.managers[g] === nl.id) G.managers[g] = null;
    if (nl.inHut) leaveHut(nl);
    releaseBed(nl, true);
    if (nl.carrying) dropCarried(nl);
    if (nl.post) { nl.post.guard = null; nl.post = null; }
    if (nl.homeT) moveHome(nl, null);
    nl.leader = true; nl.group = null; nl.maxhp = 100; nl.hp = Math.max(nl.hp, 60); nl.fear = 0; nl.downed = 0; nl.child = false; nl.r = 11;
    L = nl;
    msg(`Liderin öldü... Halk ${gen(nl.name)} etrafında toplandı. Artık sen ${cop(nl.name)}.`, '#ffb', 8);
    SFX.sting();
  } else if (!silent && !p.child) msg(`${p.name} öldü.`, '#f77', 5);
  if (!G.people.length) gameOver();
}

// ---- şafak
function halkDawn() {
  let tired = 0;
  for (const p of G.people) { p.tired = !!p.watched && !tr(p, 'uykusuz'); p.watched = false; if (p.tired) tired++; }
  if (tired) msg(`${tired} muhafız gece nöbetinden yorgun: bugün yavaşlar.`, '#bbb', 4);
  for (const p of G.people.slice()) if (p.bed && G.day >= p.bedUntil && !(p.injury && p.injury.type !== 'kanama') && !p.sick && p.hp >= p.maxhp * 0.6) releaseBed(p);

  for (const p of G.people.filter(q => q.sick)) {
    p.sick.d++;

    if (Math.random() < 0.25 + (inBed ? 0.3 : 0) + (p.sick.med ? 0.25 : 0)) { p.sick = null; msg(`${p.name} hastalığı atlattı.`, '#9f9', 4); continue; }
    p.sick.med = false;
    if (!inBed && spread < 2) { const c = G.people.filter(q => !q.sick && !q.leader && !q.bed && dist(q, p) < 400); if (c.length && Math.random() < 0.25) { spread++; makeSick(pick(c), `${dat(p.name)} bakarken hastalandı`); } }
  }
  if (G.unclean > 0 && Math.random() < Math.min(0.6, G.unclean * 0.025)) {
    const c = G.people.filter(q => !q.sick && !q.child);
    const n = Math.min(c.length, ri(1, 2));
    for (let i = 0; i < n; i++) makeSick(c.splice(Math.floor(Math.random() * c.length), 1)[0], 'temizlenmemiş etten zehirlendi');
    if (n) msg('Salgın! Et ustası olmadan işlenen et hastalık getirdi.', '#e9a050', 6);
  }
  G.unclean = Math.floor((G.unclean || 0) * 0.3);
  if (G.day >= 5 && Math.random() < 0.03) { const c = G.people.filter(q => !q.sick && !q.child); if (c.length) makeSick(pick(c), 'bataklık hummasına yakalandı'); }
  for (const p of G.people) if (!p.child && !p.leader && !p.sick && tr(p, 'hasta') && Math.random() < 0.1) makeSick(p, 'yine hastalandı');
  // çocuklar
  for (const p of G.people) if (p.child) {
    p.age++;
    if (p.age >= 3) {
      p.child = false; p.r = 11; p.traits = pickTraits(); p.story = 'Bu kampta doğdu; başka bir dünya bilmiyor.';
      p.maxhp = Math.round(60 * (tr(p, 'guclu') ? 1.3 : 1) * (tr(p, 'hasta') ? 0.75 : 1)); p.hp = p.maxhp; p.group = G.newGroup;
      const par = G.people.find(q => q.id === p.parentA || q.id === p.parentB);
      if (par) for (const s in SKILLS) p.sk[s] = Math.max(p.sk[s], Math.floor((par.sk[s] || 0) * 0.3));
      msg(`${p.name} büyüdü ve ${GROUPS[p.group].ad} grubuna katıldı.`, '#9f9', 5); moraleAdd(5);
    }

    if (b) { a.partner = b.id; b.partner = a.id; msg(`${a.name} ve ${b.name} birbirine yakınlaştı. ❤ Artık aynı çadırı paylaşacaklar.`, '#f9c', 5); moraleAdd(3); }
  }

    const b = G.people.find(q => q.id === a.partner); if (!b) continue;
    done.add(a.id); done.add(b.id);
    const home = homeOf(a) || homeOf(b);
    const kids = G.people.filter(q => q.child && (q.parentA === a.id || q.parentB === a.id)).length;
    if (home && G.morale >= 40 && foodTotal() >= 10 && kids < 2 && Math.random() < 0.22) {
      const c = mkPerson(home.x + rand(-20, 20), home.y + 30, freshName(), false, true);
      c.parentA = a.id; c.parentB = b.id; c.group = null; G.people.push(c);
      msg(`${a.name} ve ${gen(b.name)} bir bebeği oldu: ${c.name}! 👶`, '#ffd0e0', 6); moraleAdd(8); unlock('cocuk');
    }
  }
  const hl = homelessCount();
  if (hl > 0) { moraleAdd(-Math.min(8, hl)); msg(`${hl} kişi çadırsız, ateş başında üşüyerek uyudu. Çadır inşa et.`, '#bbb', 4); }
  // isyan
  const ad = G.people.filter(p => !p.child && !p.leader);
  if (G.morale < 20 && ad.length >= 4 && Math.random() < 0.5) {
    const th = pick(ad.filter(p => !Object.values(G.managers).includes(p.id))) || pick(ad);
    const steal = Math.floor(G.stock.food * 0.3);
    G.stock.food -= steal; G.lost++; G.lossToday = true;
    msg(`${th.name} gece ${steal}🍖 çalıp kaçtı. Halk sana artık güvenmiyor.`, '#f96', 7);
    removePerson(th); moraleAdd(-5);
  } else if (G.morale < 20) msg('Halkın morali çok düşük. Fısıltılar başladı...', '#fb9', 5);
  G.uiDirty = true;
}

// ---- hareket ve çarpışma
function pushOut(e, isDino) {

    if (pools.length) { const pl = pick(pools), d = mkDino('batakci', pl.x, pl.y); d.home = pl; pl.croc = d; d.hidden = true; d.st = 'hide'; G.dinos.push(d); }
  }
}
function spawnDevEvent(sudden) {
  const pos = sudden ? spawnPos(480, 600, G.fire) : spawnPos(1100, 1300);
  if (!pos) return;
  const d = spawnPack('dev', 1, pos)[0];

  G.devSeenEver = true;
  for (const q of G.people) q.fear = Math.min(100, q.fear + 25);
}

// ---- düşman tükürükleri
function updEProj(dt) {
  if (!G.eproj.length) return;
  const prey = preyList();
  for (const q of G.eproj) {
    q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
    for (const t of prey) {
      if (Math.hypot(t.x - q.x, t.y - q.y) < bodyR(t) + 5) {
        hurt(t, q.dmg, q.src);
        if (!t.type && !t.isRescue && !t.injury && !t.dead && Math.random() < 0.3) { t.injury = { type: 'enfeksiyon', t: 0 }; msg(t === L ? 'Zehirli tükürük! Yaran mikrop kaptı.' : `${dat(t.name)} zehirli tükürük isabet etti!`, '#bf8', 4); }
        q.life = 0; break;
      }
    }
  }
  G.eproj = G.eproj.filter(q => q.life > 0);
}

// =============================================================
//  YAMYAMLAR
// =============================================================
function spawnGuards(c) {
  const n = 3 + Math.min(3, Math.floor(G.day / 3));
  for (let i = 0; i < n; i++) { const a = i / n * TAU, d = mkDino('yamyam', c.x + Math.cos(a) * 110, c.y + Math.sin(a) * 110); d.campI = c.i; d.pa = a; G.dinos.push(d); }

}
function startRaid() {
  const live = G.ccamps.filter(c => c.alive); if (!live.length) return false;
  const c = live.sort((a, b) => dist(a, G.fire) - dist(b, G.fire))[0];

    d.campI = c.i; d.raid = true; d.raidT = 75; d.silent = true; pushOut(d, true); G.dinos.push(d);
  }

  return true;
}
function updRaid(dt) {
  const R = G.raid; R.t += dt;
  const raiders = G.dinos.filter(d => d.type === 'yamyam' && d.raid && !d.leave);

  if (!R.charged) {
    const near = raiders.filter(d => dist(d, G.fire) < fireR() + 230).length;
    if (R.t > 28 || near >= Math.ceil(raiders.length * 0.6)) {
      R.charged = true;
      for (const d of raiders) d.charge = true;
      const d0 = raiders[0];
      SFX.warcry(1, panOf(d0.x)); jumpAt(d0.x, d0.y, 'YAMYAM BASKINI!');
      for (const p of G.people) p.fear = Math.min(100, p.fear + 30);
    }
  }
}
function captiveArrive(c, v) {
  removePerson(v); v.dead = false; v.grabbed = false; v.downed = 0;
  c.captives.push({ p: v, eatDay: phase() < 0.45 ? G.day : G.day + 1 });
  c.found = true; moraleAdd(-8);
  msg(`Yamyamlar ${acc(v.name)} kamplarına götürdü! ☠ Ertesi akşama kadar kurtarmazsan...`, '#ff6a4a', 8);
}
function freeCaptive(c, k) {
  const v = c.captives.splice(k, 1)[0].p;
  Object.assign(v, { x: c.x - 40 + rand(-10, 10), y: c.y + 50, group: 'takip', fear: 60, hp: Math.max(v.hp, 20), tgt: null, st: 'idle', carry: 0, bag: {}, dead: false, grabbed: false, inHut: null, post: null });
  G.people.push(v); moraleAdd(8); G.uiDirty = true;
  msg(`${acc(v.name)} kurtardın! Titreyerek peşinden geliyor.`, '#9f9', 5); SFX.bell();
}
function destroyCamp(c) {
  c.alive = false; c.totem = 0;
  while (c.captives.length) freeCaptive(c, 0);
  for (const d of G.dinos) if (d.type === 'yamyam' && d.campI === c.i) { d.leave = true; d.raid = false; }
  addStock('food', 30, c.x, c.y); addStock('bone', 12, c.x, c.y + 14); addStock('hide', 10, c.x, c.y + 28);
  moraleAdd(15); SFX.crash(0.8, 0); SFX.bell();
  msg('Yamyam totemi yıkıldı! Kamp dağıldı. Halkın bu gece biraz daha rahat uyuyacak.', '#ffd27a', 7);
}
function updCannibal(d, dt, prey) {
  const def = DINO.yamyam, c = G.ccamps[d.campI];
  d.swing = Math.max(0, (d.swing || 0) - dt);
  if (d.carry) {
    const v = d.carry;
    if (!c || !c.alive) { dropCarry(d, true); d.leave = true; return; }
    steer(d, c.x, c.y, def.spd * 0.95, dt, true); d.anim += dt * 9;
    v.x = d.x - Math.cos(d.ang) * 12; v.y = d.y - Math.sin(d.ang) * 12;
    if (Math.random() < dt * 0.4 && L) SFX.scream(clamp(1 - dist(d, L) / 1300, 0.05, 0.5), panOf(d.x));
    if (dist(d, c) < 60) { d.carry = null; captiveArrive(c, v); d.raid = false; d.charge = false; d.silent = false; }
    return;
  }
  if (d.leave) {
    if (c && c.alive) { steer(d, c.x, c.y, def.spd, dt, true); d.anim += dt * 10; if (dist(d, c) < 110) { d.leave = false; d.raid = false; d.charge = false; d.silent = false; } }
    else { const a = angTo(G.fire, d); steer(d, d.x + Math.cos(a) * 200, d.y + Math.sin(a) * 200, def.spd, dt, true); d.anim += dt * 10; if (!L || dist(d, L) > 1600) removeDino(d); }
    return;
  }
  d.think -= dt;
  let t = !t_dead(d.tgt) ? d.tgt : null;
  if (d.raid) {
    d.raidT -= dt; if (d.raidT <= 0) { d.leave = true; return; }
    if (!d.charge) {
      const a = angTo(G.fire, d) + Math.sin(G.now * 0.3 + d.id) * 0.3, R = fireR() + 150;
      steer(d, G.fire.x + Math.cos(a) * R, G.fire.y + Math.sin(a) * R, def.spd * 0.6, dt, true); d.anim += dt * 6;
      return;
    }
    if (d.think <= 0) {
      d.think = 0.4; let best = null, bs = 1e9;
      for (const q of prey) { if (q.type) continue; const s = dist(d, q) + (q.leader ? 160 : 0) - (q.child ? 120 : 0); if (s < bs) { bs = s; best = q; } }
      d.tgt = t = best;
    }
  } else {
    if (!c || !c.alive) { d.leave = true; return; }
    if (d.think <= 0) {
      d.think = 0.5; let best = null, bs = def.sense;
      for (const q of prey) { if (dist(q, c) > 520) continue; const dd = dist(q, d); if (dd < bs) { bs = dd; best = q; } }
      if (best && !d.tgt) SFX.warcry(volOf(d, 900) * 0.7, panOf(d.x));
      d.tgt = t = best;
    }
    if (!t) { d.pa = (d.pa || 0) + dt * 0.25; steer(d, c.x + Math.cos(d.pa) * 120, c.y + Math.sin(d.pa) * 120, def.spd * 0.35, dt, true); d.anim += dt * 4; return; }
    if (dist(t, c) > 650) { d.tgt = null; return; }
  }
  if (!t) return;
  const reach = d.r + bodyR(t) + 8;
  if (dist(d, t) > reach) { steer(d, t.x, t.y, def.spd * (d.charge ? 1.15 : 1), dt, true); d.anim += dt * 11; return; }
  d.moving = false; d.ang = angTo(d, t);
  if (d.atkCd > 0) return;
  d.atkCd = def.cd * rand(0.85, 1.15); d.swing = 0.25;
  const R = G.raid;
  if (!t.leader && !t.type && !t.isRescue && Math.random() < (d.raid ? 0.4 : 0.25) && (!R || R.grabbed < 2)) {
    t.grabbed = true; t.grabT = 12; t.downed = 0; d.carry = t; if (R) R.grabbed++;
    if (t.tgt && t.tgt.claim === t) t.tgt.claim = null;
    if (t.inHut) leaveHut(t);
    msg(`YAMYAMLAR ${acc(t.name).toLocaleUpperCase('tr')} SÜRÜKLÜYOR! Peşlerinden git!`, '#ff5040', 6);
    SFX.scream(1, panOf(t.x)); for (const p of G.people) p.fear = Math.min(100, p.fear + 20);
    return;
  }
  hurt(t, def.dmg * rand(0.8, 1.2), d);
  if (L && dist(d, L) < 700) SFX.hit(0.4);
}

// =============================================================
//  OTLAYANLAR: Ördekgaga (sürü, kaçar), Kafakalkan (bölgeci, toslar), Zırhlı (kuyruk topuzu)
// =============================================================
function alarmHerd(d, thr) {
  if (!thr) return;
  let any = false;
  for (const o of G.dinos) if (o.type === d.type && !o.tamed && dist(o, d) < 320) { if (!(o.flee > 0)) any = true; o.flee = rand(4, 7); o.fleeFrom = thr; }
  if (any) SFX.honk(volOf(d, 900) + 0.03, panOf(d.x));
}
function updGrazer(d, dt) {
  const def = DINO[d.type];
  d.swing = Math.max(0, (d.swing || 0) - dt);
  if (isNight() && !d.leave && Math.random() < dt * 0.03) d.leave = true;
  if (d.leave) { const a = angTo(G.fire, d); steer(d, d.x + Math.cos(a) * 150, d.y + Math.sin(a) * 150, def.spd * 0.9, dt, true); d.anim += dt * 5; if (!L || dist(d, L) > 1700) removeDino(d); return; }
  if (d.flee > 0) {
    d.flee -= dt; const from = d.fleeFrom && !d.fleeFrom.dead ? d.fleeFrom : G.fire, a = angTo(from, d) + Math.sin(G.now + d.id) * 0.3;
    steer(d, d.x + Math.cos(a) * 200, d.y + Math.sin(a) * 200, def.spd * 2, dt, true); d.anim += dt * 12; return;
  }
  const dc = dist(d, G.fire);
  if (dc < 430 && !(d.angry > 0)) { const a = angTo(G.fire, d); steer(d, d.x + Math.cos(a) * 120, d.y + Math.sin(a) * 120, def.spd, dt, true); d.anim += dt * 5; return; }
  d.lookT = (d.lookT || 0) - dt;
  if (d.lookT <= 0) {
    d.lookT = 0.5;
    if (d.type === 'ordek') {
      let thr = null;
      for (const p of G.people) if (!p.inHut && !p.bed && dist(p, d) < (p.moving ? 230 : 150)) { thr = p; break; }
      if (!thr) for (const o of G.dinos) if (DINO[o.type].pred && !o.tamed && dist(o, d) < 300) { thr = o; break; }
      if (thr) alarmHerd(d, thr);
    } else if (d.type === 'gurleyen' && !(d.angry > 0) && dc > 500) {
      for (const p of G.people) if (!p.inHut && !p.bed && dist(p, d) < 115) { d.angry = 6; d.tgt = p; SFX.honk(volOf(d, 700) * 0.6, panOf(d.x)); break; }
    }
  }
  if (d.angry > 0) {
    d.angry -= dt; const t = d.tgt;
    if (!t_dead(t)) {
      if (d.type === 'gurleyen') {
        if (dist(d, G.fire) < 380 && !(d.tgt && G.hunt && G.hunt.t === d)) { d.angry = 0; return; }
        if (d.hp < d.maxhp * 0.35) { d.flee = 6; d.fleeFrom = t; d.angry = 0; return; }
        const reach = d.r + bodyR(t) + 6;
        if (dist(d, t) > reach) { steer(d, t.x, t.y, def.spd * 2.2, dt, true); d.anim += dt * 12; }
        else if (d.atkCd <= 0) { d.atkCd = def.cd; hurt(t, def.dmg, d); if (!t.type) { const a = angTo(d, t); t.x += Math.cos(a) * 50; t.y += Math.sin(a) * 50; pushOut(t, false); } SFX.thump(0.4); d.angry = Math.min(d.angry, 2.5); }
        return;
      }
      // zırhlı: kuyruğunu saldırgana çevirir
      const dd = dist(d, t);
      d.ang = angLerp(d.ang, angTo(d, t) + Math.PI, Math.min(1, dt * 2)); d.moving = true; d.anim += dt * 2;
      if (dd > d.r + bodyR(t) + 60) { const a = angTo(t, d); steer(d, d.x + Math.cos(a) * 40, d.y + Math.sin(a) * 40, def.spd * 0.5, dt, true); d.ang = angLerp(d.ang, angTo(d, t) + Math.PI, 0.5); }
      if (dd < d.r + bodyR(t) + 48 && angDiff(d.ang + Math.PI, angTo(d, t)) < 0.9 && d.atkCd <= 0) {
        d.atkCd = def.cd; d.swing = 0.4; hurt(t, def.dmg, d);
        if (!t.type) { const a = angTo(d, t); t.x += Math.cos(a) * 70; t.y += Math.sin(a) * 70; pushOut(t, false); }
        SFX.thump(0.7); G.shake = Math.max(G.shake, L && dist(d, L) < 400 ? 6 : 0);
      }
      return;
    }
  }
  const hl = d.herdL && !d.herdL.dead && d.herdL !== d ? d.herdL : null;
  if (hl && dist(d, hl) > 70 + d.r) { steer(d, hl.x + Math.cos(d.id) * 50, hl.y + Math.sin(d.id) * 50, def.spd * 0.7, dt, true); d.anim += dt * 4; return; }
  wanderSlow(d, dt, def.spd * 0.4);
}
// =============================================================
//  BENZEYEN — kamptan birinin kılığına giren şey
// =============================================================
function reveal(d) {
  if (d.revealed) return;
  d.revealed = true;
  SFX.shriek(1, panOf(d.x));
  jumpAt(d.x, d.y, `O ${d.disguise.name.toLocaleUpperCase('tr')} DEĞİL!`);
  for (const p of G.people) p.fear = Math.min(100, p.fear + (dist(p, d) < 500 ? 45 : 20));
}
function spawnMimicCreature() {
  const vs = G.people.filter(p => !p.leader && !p.child); if (!vs.length) return null;
  const v = pick(vs), pos = spawnPos(650, 800, G.fire); if (!pos) return null;
  const d = mkDino('taklitci', pos.x, pos.y);
  d.disguise = { name: v.name, skin: v.skin, hair: v.hair, group: v.group }; d.revealed = false; d.kills = 0;
  G.dinos.push(d); return d;
}
function updMimicC(d, dt, prey) {
  const def = DINO.taklitci;
  if (d.leave) { const a = angTo(G.fire, d); steer(d, d.x + Math.cos(a) * 200, d.y + Math.sin(a) * 200, 230, dt, true); d.anim += dt * 14; if (!L || dist(d, L) > 1300) removeDino(d); return; }
  if (!isNight() && !d.revealed) { d.leave = true; return; }
  if (!d.revealed) {
    d.jerk = (d.jerk || 0) - dt;
    if (d.jerk <= 0) { d.jerk = rand(0.4, 1.4); d.pause = Math.random() < 0.3 ? rand(0.3, 1.4) : 0; d.tilt = rand(-0.7, 0.7); }
    if (d.pause > 0) { d.pause -= dt; d.moving = false; return; }
    let best = null, bs = 1e9;
    for (const t of prey) { if (t.type || t.isRescue) continue; const s = dist(d, t) - (dist(t, G.fire) > fireR() * 0.7 ? 300 : 0) + (t.leader ? 200 : 0); if (s < bs) { bs = s; best = t; } }
    d.tgt = best;
    steer(d, best ? best.x : G.fire.x, best ? best.y : G.fire.y, 72, dt, true); d.anim += dt * 7;
    if (best && dist(d, best) < 58) reveal(d);
    return;
  }
  let t = !t_dead(d.tgt) && !d.tgt.type ? d.tgt : null;
  if (!t) { let bd = 520; for (const q of prey) { if (q.type) continue; const dd = dist(q, d); if (dd < bd) { bd = dd; t = q; } } d.tgt = t; }
  if (!t) { d.leave = true; return; }
  const reach = d.r + bodyR(t) + 8;
  if (dist(d, t) > reach) { steer(d, t.x, t.y, def.spd * 2.2, dt, true); d.anim += dt * 16; return; }
  d.moving = false; d.ang = angTo(d, t);
  if (d.atkCd <= 0) {
    d.atkCd = def.cd; d.swing = 0.3;
    hurt(t, def.dmg * rand(0.9, 1.1), d); SFX.hit(0.8);
    if (t.dead || t.downed > 0) d.kills++;
    if (d.kills >= 2 || d.hp < d.maxhp * 0.4) { d.leave = true; msg('Benzeyen karanlığa geri süzüldü... Bir gün yine gelecek.', '#bbb', 6); }
  }
}

// =============================================================
//  KESİCİ — yalnız kalanı avlar; 2-3 kişi bir aradaysa geri çekilir
// =============================================================
function alliesNear(p, r) { let n = 0; for (const q of G.people) if (q !== p && !q.child && !q.downed && !q.inHut && !q.bed && !q.insideB && dist(q, p) < r) n++; return n; }
function updKesici(d, dt, prey) {
  const def = DINO.kesici;
  if (d.leave) { const a = angTo(G.fire, d); steer(d, d.x + Math.cos(a) * 200, d.y + Math.sin(a) * 200, def.spd * 0.8, dt, true); d.anim += dt * 12; if (!L || dist(d, L) > 1500) removeDino(d); return; }
  if (d.hp < d.maxhp * 0.35 || (d.kills || 0) >= 2) { d.leave = true; return; }
  if (d.retreat > 0) {
    d.retreat -= dt; d.dash = 0;
    const fr = d.tgt && !d.tgt.dead ? d.tgt : G.fire, a = angTo(fr, d) + Math.sin(G.now + d.id) * 0.4;
    steer(d, d.x + Math.cos(a) * 120, d.y + Math.sin(a) * 120, def.spd * 0.8, dt, true); d.anim += dt * 14; return;
  }
  d.think -= dt;
  const zones = safeZones();
  if (d.think <= 0 && !(d.dash > 0)) {
    d.think = 0.6; let best = null, bs = 1e9;
    for (const t of prey) {
      if (t.type || t.isRescue) continue;
      if (G.fire.fuel > 0 && inSafe(t.x, t.y, zones)) continue;
      const al = alliesNear(t, 150); if (al >= 2) continue;
      const dd = dist(d, t); if (dd > (isNight() ? def.nsense : def.sense)) continue;
      const s = dd + al * 300 + (t.leader ? 150 : 0);
      if (s < bs) { bs = s; best = t; }
    }
    d.tgt = best;
  }
  const t = !t_dead(d.tgt) && !d.tgt.type ? d.tgt : null;
  if (!t) {
    d.wt -= dt;
    if (d.wt <= 0 || Math.hypot(d.wx - d.x, d.wy - d.y) < 20) { d.wt = rand(4, 9); const a = rand(0, TAU), r = Math.max(fireR(), 300) + rand(250, 550); d.wx = G.fire.x + Math.cos(a) * r; d.wy = G.fire.y + Math.sin(a) * r; }
    steer(d, d.wx, d.wy, def.spd * 0.3, dt, true); d.anim += dt * 5; return;
  }
  const dd = dist(d, t);
  if (!(d.dash > 0)) {
    if (dd > 240) { steer(d, t.x, t.y, def.spd * 0.42, dt, true); d.anim += dt * 6; return; }
    d.dash = 2.4;
    if (L && dist(t, L) < 650) jumpAt(t.x, t.y, 'KESİCİ!'); else msg(`Uzaklardan bir çığlık... ${dat(t.name)} bir şey saldırıyor!`, '#f77', 4);
    SFX.screech(L ? clamp(1 - dist(d, L) / 900, 0.2, 1) : 0.3, panOf(d.x));
  }
  d.dash -= dt;
  if (alliesNear(t, 140) >= 2) { d.retreat = rand(2.5, 4); SFX.chitter(L ? clamp(1 - dist(d, L) / 800, 0.1, 0.6) : 0.2, panOf(d.x)); if (!G.flags.kesiciHint) { G.flags.kesiciHint = 1; msg('Kesici kalabalığı görünce geri çekildi. Birlikte durun!', '#fd9', 5); } return; }
  if (dd > d.r + bodyR(t) + 8) { steer(d, t.x, t.y, def.spd, dt, true); d.anim += dt * 16; if (d.dash <= 0) d.retreat = 2; return; }
  d.moving = false; d.ang = angTo(d, t);
  if (d.atkCd <= 0) {
    d.atkCd = def.cd; d.dash = 0;
    hurt(t, def.dmg * rand(0.9, 1.15), d);
    if (!t.dead && !t.injury && t.hp > 0 && Math.random() < 0.5) t.injury = { type: 'kanama', t: 14 };
    if (t.dead || t.downed > 0) d.kills = (d.kills || 0) + 1;
    SFX.hit(0.8); d.retreat = rand(2.5, 4);
  }
}

<script>
'use strict';
// =============================================================

function resetState(diff) {
  for (const k of Object.keys(G)) delete G[k];

  msg(n ? `🎯 ${n} avcı ${DINO[best.type].ad} için yola çıktı.${members('takip').length ? ' Takipçilerin de saldıracak.' : ''}` : `🎯 Hedef: ${DINO[best.type].ad}. Ama hiç 🏹 Avcın yok!`, n ? '#ffd27a' : '#e99', 4);

  const it = G.interact;
  $('prompt').textContent = G.huntMode ? '🎯 Avlanacak hayvana dokun / tıkla' : G.placing ? `${BUILD[G.placing].ad} planlanıyor` : G.lcarry ? `🩺 ${acc(G.lcarry.name)} taşıyorsun — şifahaneye götür (E: bırak)` : it ? (isTouch ? '[Topla] ' : '[E] ') + it.label : G.carryEgg ? '🥚 Yumurtayı ateşe götür!' : '';
  if (G.tut.on && G.tut.step < TUT.length) { $('tutBox').style.display = 'block'; $('tutBox').innerHTML = `<b>Öğretici ${G.tut.step + 1}/${TUT.length}</b> ${TUT[G.tut.step].t} <button id="tutSkip">Geç</button>`; }
  else $('tutBox').style.display = 'none';
}
$('tutBox').addEventListener('pointerdown', e => { if (e.target.id === 'tutSkip') { G.tut.on = false; store.set('sonAtesTutDone', '1'); } });
function hudTick(dt) {
  UI.hudT -= dt; if (UI.hudT <= 0) { UI.hudT = 0.15; updateHUD(); renderMsgs(); }
  else if (G.msgDirty) renderMsgs();
  UI.sideT -= dt; if (UI.sideT <= 0 || (G.uiDirty && UI.sideT < 0.45)) { UI.sideT = 0.6; renderSide(); }
  UI.miniT -= dt; if (UI.miniT <= 0) { UI.miniT = 0.25; drawMini(); }
  UI.toolT -= dt; if (UI.toolT <= 0 || G.toolsDirty) { UI.toolT = 1; buildTools(); }
  if ($('craft').style.display === 'flex') { UI.craftT -= dt; if (UI.craftT <= 0 || G.craftDirty) { UI.craftT = 0.6; renderCraft(); } }
  if (UI.char) { UI.charT -= dt; if (UI.charT <= 0) { UI.charT = 0.7; renderChar(); } }
  if (UI.inB) renderInterior();
}

// ---- ekranlar
function saveInfo() { const s = store.get('sonAtesKayit'); if (!s) return null; try { const d = JSON.parse(s); if (d.v !== 3) return null; return { day: d.day, diff: d.diff, s }; } catch (e) { return null; } }
function startScreen() {
  G.started = false; $('hud').style.display = 'none';
  const sv = saveInfo(), tutDone = store.get('sonAtesTutDone');
  const achList = Object.entries(ACH).map(([k, a]) => `<div class="${ACHSET.has(k) ? 'got' : ''}">${ACHSET.has(k) ? '🏆' : '🔒'} <b>${a.ad}</b> — ${a.desc}</div>`).join('');
  const best = +(store.get('sonAtesRekor') || 0);
  $('screenBox').innerHTML = `<h1>SON ATEŞ</h1>
  <p class="story">Bir fırtına. Kör edici bir ışık. Uyandığınızda gökyüzünde tanımadığınız kanatlar,<br>ormanda tanımadığınız sesler vardı. Sekiz kişisiniz. Bir mağaranız, bir ateşiniz var.<br>Uzaklarda bir yerde, sizi buraya getiren yarık hâlâ parlıyor.<br><b>Ve gece yaklaşıyor.</b></p>
  ${sv ? `<button id="cont" class="big">DEVAM ET <small>(${sv.day}. gün · ${DIFF[sv.diff] ? DIFF[sv.diff].ad : ''})</small></button><br>` : ''}
  <div class="diffs">${Object.entries(DIFF).map(([k, d]) => `<button data-d="${k}" class="${UI.diff === k ? 'on' : ''}">${d.ad}</button>`).join('')}</div>
  <p class="ddesc" id="ddesc">${DIFF[UI.diff].desc}</p>
  <label class="chk"><input type="checkbox" id="tutChk" ${tutDone ? '' : 'checked'}> Öğretici ile başla</label><br>
  <button id="go" class="big">${sv ? 'YENİ OYUN' : 'ATEŞİ YAK'}</button>
  ${best ? `<p>En uzun hayatta kalma: <b>${best} gün</b></p>` : ''}
  <details><summary>Nasıl oynanır?</summary><div class="keys">${isTouch ? `<b>Sol taraf</b> hareket · <b>Saldır</b> mızrak · <b>Ok</b> yay · <b>Topla/Kullan</b> toplama, ateş, tedavi, taşıma, evcilleştirme, binme` : `<b>WASD</b> hareket · <b>Shift</b> koş · <b>Fare/Boşluk</b> mızrak · <b>F / sağ tık</b> ok<br><b>E</b> (basılı) topla · ateşe odun · tedavi · inşaata yardım · kurtar · (bas) bin/in, yaralı taşı<br><b>G</b> av emri · <b>C</b> üretim · <b>M</b> harita · <b>H</b> halk paneli · <b>1-9</b> inşa planı · <b>T</b> meşale · <b>P</b> duraklat`}<br>
  <b>Halk</b>: 13 meslek grubu. Herkes yaptığı işte seviye atlar (1-10). Karakter kartından (ⓘ) becerileri gör, görev ve doğrudan üretim emri ver.<br>
  <b>Yiyecek</b>: asıl kaynak avcılık. 🎯 ile bir hayvan seç; avcılar mesafeyi koruyarak avlar. Leşi 🔪 Et Ustası temizlemezse çiğ et salgın getirebilir. Tarlalar da ekilebilir.<br>
  <b>Mağara ve odalar</b>: halk mağarada başlar. <b>I</b> ile mağaranın, kulübenin ve diğer yapıların içini gör, odalara görev ver (yatakhane, depo, mutfak, şifa, et temizleme, atölye), içeriden karakter seç.<br>
  <b>Yemek</b>: leş → taşıyıcılar → 🔪 et ustası temizler → 🍲 aşçı pişirir. Öğle ve akşam yemek vakti herkes masaya gelir. Çiğ et hastalık getirebilir.<br>
  <b>Barınma</b>: her tek kişi ya da çift bir yerde yaşar (çadır = 1 hane, yatakhane odası = 2 hane). Yer yoksa yeni insanlar gelmez. Çitsiz evler nadiren saldırıya uğrar.<br>
  <b>Sağlık</b>: yaralılar şifahaneye taşınır, günlerce tedavi görür. Salgınlar nadiren öldürür ama yayılır.<br>
  <b>Bilinmezlik</b>: sadece halkının gördüğünü görürsün. Geceler çoğu zaman sessizdir... ama her zaman değil. Yüzü tanıdık gelen her şeye güvenme.<br>
  <b>Hedef</b>: yarığı bul, halkını 30 kişiye çıkar, 6. seviye bir zanaatkâra Yarık Taşı yaptır ve son savaşı kazan.</div></details>
  <details><summary>Başarımlar (${ACHSET.size}/${Object.keys(ACH).length})</summary><div class="achs">${achList}</div></details>
  <p style="font-size:12px;color:#776">🎧 Kulaklıkla oyna.</p>`;
  $('screen').style.display = 'flex';
  for (const b of document.querySelectorAll('.diffs button')) b.onclick = () => { UI.diff = b.dataset.d; for (const x of document.querySelectorAll('.diffs button')) x.classList.toggle('on', x === b); $('ddesc').textContent = DIFF[UI.diff].desc; };
  $('go').onclick = () => { audioInit(); newGame(UI.diff, $('tutChk').checked); };
  if (sv) $('cont').onclick = () => { audioInit(); try { loadGame(sv.s); } catch (e) { console.error(e); store.del('sonAtesKayit'); startScreen(); } };
}
function onGameStart() {
  $('screen').style.display = 'none'; $('hud').style.display = 'block'; $('pause').style.display = 'none';
  G.started = true; G.paused = false; G.modal = false; $('craft').style.display = 'none'; $('charM').style.display = 'none'; UI.char = 0; $('inM').style.display = 'none'; UI.inB = null;
  UI.sel.clear(); UI.filter = 'all';
  if (innerWidth <= 700) { toggleSide(false); $('miniBox').style.display = 'none'; } else { toggleSide(true); $('miniBox').style.display = 'block'; }
  $('miniBox').classList.remove('big');
  buildTools(); renderSide(); updateHUD();
}
function showGameOver() {
  const dawn = G.diff === 'kolay' && store.get('sonAtesSafak');
  $('screenBox').innerHTML = `<h1 style="color:#c33;text-shadow:0 0 30px #600">KARANLIK</h1>
  <p class="story">Ateşin son közü de söndü. Ormanın sesleri, sanki hiçbir şey olmamış gibi devam etti.</p>
  <p><b>${G.day}</b> gün hayatta kaldınız · <b>${G.kills}</b> yaratık · <b>${G.stats.hunts || 0}</b> av · <b>${G.deaths}</b> ölü · <b>${G.lost}</b> kayıp</p>
  <p>Rekor: <b>${store.get('sonAtesRekor') || G.day} gün</b></p>
  ${dawn ? '<button id="dawn" class="big">SON ŞAFAKTAN DEVAM</button><br>' : ''}
  <button id="again" class="big">YENİDEN DENE</button><br><button id="menu">Ana menü</button>`;
  $('screen').style.display = 'flex'; $('hud').style.display = 'none';
  if (dawn) $('dawn').onclick = () => loadGame(dawn);
  $('again').onclick = () => newGame(G.diff, false);
  $('menu').onclick = startScreen;
}
function showVictory(saved, left) {
  $('screenBox').innerHTML = `<h1 style="color:#9cf;text-shadow:0 0 30px #36f">EVE DÖNÜŞ</h1>
  <p class="story">Yarık bir nefes gibi açıldı ve kapandı. Arkada, ormanın içinde, bir ateş hâlâ yanıyordu.</p>
  <p><b>${saved.length}</b> kişi yarıktan geçti: ${saved.map(p => p.name).join(', ')}.</p>
  ${left ? `<p class="story">${left} kişi geride, kampta kaldı. Onlar bu dünyanın ilk köyünü kuracak.</p>` : ''}
  <p><b>${G.day}</b> gün · <b>${G.kills}</b> yaratık · <b>${G.deaths}</b> kayıp · ${DIFF[G.diff].ad}</p>
  <button id="menu" class="big">ANA MENÜ</button>`;
  $('screen').style.display = 'flex'; $('hud').style.display = 'none';
  $('menu').onclick = startScreen;
}

// ---- döngü
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (G.started && L) {
    if (!G.paused && !G.over && !G.modal) update(dt);
    if (L) { render(); hudTick(dt); }
  }
  requestAnimationFrame(loop);
}
makeGround();
startScreen();
requestAnimationFrame(loop);
window.__G = G; window.__getL = () => L;

</script>
<script>
(function(){const t=document.getElementById('top');try{if(localStorage.getItem('sonAtesTop')==='0')t.classList.add('kapali')}catch(e){}
t.style.pointerEvents='auto';t.addEventListener('click',function(e){e.stopPropagation();t.classList.toggle('kapali');try{localStorage.setItem('sonAtesTop',t.classList.contains('kapali')?'0':'1')}catch(e){}});
t.addEventListener('touchstart',function(e){e.stopPropagation()},{passive:true});})();
</script>
</body>
</html>
