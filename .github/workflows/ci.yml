name: CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: randevu
          POSTGRES_PASSWORD: randevu
          POSTGRES_DB: randevu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U randevu -d randevu"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://randevu:randevu@localhost:5432/randevu
      NEXTAUTH_SECRET: ci-dummy-secret-not-for-production-0123456789
      NEXTAUTH_URL: http://localhost:3000
      JOBS_QUEUE: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # sürüm package.json `packageManager` alanından (pnpm 10.28.0)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run ci
      - run: pnpm build
